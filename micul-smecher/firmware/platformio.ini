; Micul Șmecher — firmware v0 ("Suflet" = the soul engine)
;
;   pio run -e amoled143 -t upload     Waveshare ESP32-S3-Touch-AMOLED-1.43 (no audio)
;   pio run -e amoled175 -t upload     Waveshare ESP32-S3-Touch-AMOLED-1.75 (mics + speaker)
;   pio run -e lcd28 -t upload         Waveshare ESP32-S3-Touch-LCD-2.8C (2.8" IPS 480x480, "SOUL M")
;   pio run -e sim                     PC simulator -> .pio/build/sim/program
;   pio test -e native                 unit tests on the PC

[platformio]
default_envs = amoled143

[common_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.8
  bblanchon/ArduinoJson @ ^7.4.2
  lewisxhe/SensorLib @ 0.4.1
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -O2

[env:amoled143]
extends = common_esp32
build_flags = ${common_esp32.build_flags} -DSUFLET_BOARD_AMOLED143=1

[env:amoled175]
extends = common_esp32
build_flags = ${common_esp32.build_flags} -DSUFLET_BOARD_AMOLED175=1

; SOUL M: round 2.8" IPS, ST7701 RGB. Optional I2S parts (see README):
;   add -DSUFLET_MIC_INMP441=1 and/or -DSUFLET_SPK_MAX98357=1 to build_flags.
[env:lcd28]
extends = common_esp32
build_flags = ${common_esp32.build_flags} -DSUFLET_BOARD_LCD28=1

[env:sim]
platform = native
build_src_filter = -<*> +<../sim/sim_main.cpp>
build_flags = -std=gnu++17 -O2 -lm
lib_deps = bblanchon/ArduinoJson @ ^7.4.2
lib_compat_mode = off

[env:native]
platform = native
build_flags = -std=gnu++17 -O2
lib_deps = bblanchon/ArduinoJson @ ^7.4.2
lib_compat_mode = off
test_build_src = no
