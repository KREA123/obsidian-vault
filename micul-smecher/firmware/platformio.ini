; Micul Șmecher — firmware v0 ("Suflet" = the soul engine)
;
;   pio run -e amoled143 -t upload     Waveshare ESP32-S3-Touch-AMOLED-1.43 (no audio)
;   pio run -e amoled175 -t upload     Waveshare ESP32-S3-Touch-AMOLED-1.75 (mics + speaker)
;   pio run -e lcd28 -t upload         Waveshare ESP32-S3-Touch-LCD-2.8C (2.8" IPS 480x480, "SOUL M")
;   pio run -e sim                     PC simulator -> .pio/build/sim/program
;   pio test -e native                 unit tests on the PC

[platformio]
default_envs = amoled143

[common_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv  ; default_16MB + `soulid` (the device key, never erased by a reset)
monitor_speed = 115200
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.8
  bblanchon/ArduinoJson @ ^7.4.2
  lewisxhe/SensorLib @ 0.4.1
; -fno-exceptions (1.8): nothing here catches one (a throw from the library still ends in abort, as
; before), and the unwind tables were ~100 KB of flash (firmware/PERF.md)
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -O2
  -fno-exceptions

[env:amoled143]
extends = common_esp32
build_flags = ${common_esp32.build_flags} -DSUFLET_BOARD_AMOLED143=1

[env:amoled175]
extends = common_esp32
build_flags = ${common_esp32.build_flags} -DSUFLET_BOARD_AMOLED175=1

; SOUL M: round 2.8" IPS, ST7701 RGB. Optional I2S parts (see README):
;   add -DSUFLET_MIC_INMP441=1 and/or -DSUFLET_SPK_MAX98357=1 to build_flags.
[env:lcd28]
; static analysis: pio check -e lcd28 (cppcheck on our code only; ArduinoJson's
; macros confuse cppcheck's preprocessor, so packages are skipped)
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/> +<lib/Suflet/src/> -<lib/Suflet/src/QrEncode.cpp>
check_flags = cppcheck: --suppress=preprocessorErrorDirective --suppress=*:*/.pio/* --inline-suppr
check_severity = medium, high
extends = common_esp32
build_flags = ${common_esp32.build_flags} -DSUFLET_BOARD_LCD28=1
build_src_flags = -Wall -Wextra
; ESP-SR only in lcd28_voice (the library dependency finder would pull it in from voice_sr.cpp's #if'd include)
lib_ignore = ESP_SR

; SOUL M with the INMP441 mic and OFFLINE voice commands (docs/10-SOUL-MEMORY.md §7): Espressif ESP-SR
; (MultiNet7 English, push-to-talk) from Arduino-ESP32's own precompiled esp-sr. Flash the speech models once:
;   esptool --chip esp32s3 write-flash 0xcb0000 ~/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/esp_sr/srmodels.bin
; add -DSUFLET_VOICE_WAKE=1 for the always-on "Hi ESP" wake word, -DSUFLET_VOICE=1 for the cloud transcription too.
; ARDUINO_PARTITION_esp_sr_16 tells the ESP_SR library our table has the `model` partition (ours, not esp_sr_16.csv).
[env:lcd28_voice]
extends = env:lcd28
build_flags = ${env:lcd28.build_flags} -DSUFLET_MIC_INMP441=1 -DSUFLET_VOICE_SR=1 -DARDUINO_PARTITION_esp_sr_16=1
lib_ignore =

; the simulator links OpenSSL's libcrypto (the device key, SHA-1 for the WebSocket handshake):
; `apt install libssl-dev` on Linux, `brew install openssl` on macOS
[env:sim]
platform = native
build_src_filter = -<*> +<../sim/sim_main.cpp> +<../sim/sim_cloud.cpp> +<../sim/sim_lan.cpp> +<../sim/sim_apps.cpp> +<../sim/sim_bench.cpp>
build_flags = -std=gnu++17 -O2 -lm -lcrypto
lib_deps = bblanchon/ArduinoJson @ ^7.4.2
lib_compat_mode = off

[env:native]
platform = native
build_flags = -std=gnu++17 -O2 -lcrypto
lib_deps = bblanchon/ArduinoJson @ ^7.4.2
lib_compat_mode = off
test_build_src = no
