<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOUL Trailer</title>
<!--
  SOUL — motion-graphics product trailer.
  Deterministic: everything is a pure function of time t (seconds). No wall clock.
  render(t) draws one frame. Layout: ?v=1 → vertical 1080x1920, else 1920x1080.
  Recorded frame-by-frame by render.py (Playwright) and encoded with ffmpeg.
  Open in a browser with ?play=1 to preview in real time.
  All product images are concept renders (CGI).
-->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0E0E10;overflow:hidden}
#stage{position:relative;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;color:#0E0E10}
canvas.lo{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#card{position:absolute;overflow:hidden;background:#FBF6F0;isolation:isolate;
  box-shadow:0 40px 90px rgba(18,4,14,.55),0 0 0 1.5px rgba(255,236,214,.35)}
.root{position:absolute;left:0;top:0;transform-origin:50% 50%}
.a{position:absolute;left:0;top:0}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;letter-spacing:-.03em;line-height:1.04;white-space:nowrap;text-align:center}
.w{display:inline-block}
.cur{display:inline-block;width:.055em;height:.92em;background:#0E0E10;vertical-align:-.1em;margin-left:.05em;border-radius:3px}
.ghost{color:transparent}
.typed{position:absolute;left:0;top:0;white-space:nowrap}
.ph{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
.imgc{position:absolute;left:0;top:0;background-repeat:no-repeat;border-radius:22px;
  box-shadow:0 18px 40px rgba(70,35,20,.22),0 0 0 1px rgba(255,255,255,.6) inset}
.circ{border-radius:50%;background-repeat:no-repeat}
.ring{position:absolute;left:0;top:0;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,#ffffff 0%,#ecebe8 28%,#bdbbb8 62%,#8f8d8a 82%,#d9d7d4 100%);
  box-shadow:0 30px 70px rgba(70,30,15,.30),0 6px 14px rgba(70,30,15,.18)}
.ring>.glass{position:absolute;border-radius:50%;overflow:hidden;background:#070708;
  box-shadow:0 0 0 3px #26262a,0 0 0 5px rgba(255,255,255,.55)}
.ring>.glass>*{position:absolute;left:0;top:0;width:100%;height:100%}
.ring>.glass:after{content:'';position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(140deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,0) 38%)}
.pill{position:absolute;left:0;top:0;display:flex;align-items:center;gap:.5em;white-space:nowrap;
  background:#fff;border-radius:999px;font-weight:500;color:#0E0E10;
  box-shadow:0 14px 34px rgba(80,40,20,.16),0 0 0 1px rgba(14,14,16,.06)}
.glyph{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.line{position:absolute;left:0;top:0;background:rgba(14,14,16,.28)}
.hnd{position:absolute;left:0;top:0;width:9px;height:9px;border:1.5px solid rgba(14,14,16,.55);background:#fff}
.rip{position:absolute;left:0;top:0;border-radius:50%;border:3px solid rgba(255,240,200,.95)}
.tapdot{position:absolute;left:0;top:0;border-radius:50%;background:rgba(255,255,255,.75);
  box-shadow:0 0 0 2px rgba(255,255,255,.9),0 8px 20px rgba(0,0,0,.25)}
.bubble{position:absolute;left:0;top:0;background:#fff;border-radius:28px;
  box-shadow:0 24px 60px rgba(80,40,20,.20),0 0 0 1px rgba(14,14,16,.05)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:600}
.lbl{font-family:'DM Sans';font-weight:500;white-space:nowrap;text-align:center}
.ico{position:absolute;left:0;top:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="fbg" class="lo"></canvas>
  <div id="toplogo" class="a"></div>
  <div id="card">
    <canvas id="cbg" class="lo"></canvas>
    <div id="scenes" class="a"></div>
  </div>
  <div id="cgi" class="a lbl"></div>
  <div id="fade" class="a" style="background:#000;opacity:0;pointer-events:none"></div>
</div>
<script>
'use strict';
/* ───────────────────────── layout (data) ───────────────────────── */
const Q = new URLSearchParams(location.search);
const V = Q.get('v') === '1';
const LAYOUTS = {
  h: { W:1920, H:1080, card:{x:100,y:64,w:1720,h:956,r:36}, logo:{y:22,h:26}, cgi:{x:1820,y:1048,fs:14} },
  v: { W:1080, H:1920, card:{x:44,y:126,w:992,h:1738,r:44}, logo:{y:50,h:38}, cgi:{x:1036,y:1892,fs:18} },
};
const L = V ? LAYOUTS.v : LAYOUTS.h;
const W = L.W, H = L.H, cw = L.card.w, ch = L.card.h, cx = cw/2, cy = ch/2;
const pick = (h, v) => V ? v : h;
const T_END = 49;

/* ───────────────────────── palette ───────────────────────── */
const C = { ink:'#0E0E10', cream:'#F2EEE7', eye:'#FFF0C8', amber:'#FFB547', amberDeep:'#EE8F1F' };

/* ───────────────────────── math / easing ───────────────────────── */
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const lerp = (a,b,p) => a + (b-a)*p;
const seg = (t,a,b) => clamp((t-a)/(b-a));
const eo = p => p>=1 ? 1 : 1 - Math.pow(2, -10*p);            // expo out
const co = p => 1 - Math.pow(1-p, 3);                          // cubic out
const ci = p => p*p*p;                                         // cubic in
const eio = p => p<.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2;   // cubic in-out
const bo = p => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); }; // back out
const pulse = (t,a,b) => seg(t,a,a+(b-a)/2) - seg(t,a+(b-a)/2,b);  // 0→1→0
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }

/* ───────────────────────── DOM helpers ───────────────────────── */
function mk(tag, cls, parent, css, html){
  const e = document.createElement(tag); if (cls) e.className = cls;
  if (css) e.style.cssText = css; if (html != null) e.innerHTML = html;
  (parent || document.body).appendChild(e); return e;
}
// place element so that its anchor (ax,ay) sits at (x,y); scale/rotate about the anchor
function P(el, x, y, o = {}){
  const s = o.s ?? 1, sx = o.sx ?? s, sy = o.sy ?? s, r = o.r ?? 0, ax = o.ax ?? .5, ay = o.ay ?? .5;
  el.style.transformOrigin = `${ax*100}% ${ay*100}%`;
  el.style.transform = `translate(${x}px,${y}px) translate(${-ax*100}%,${-ay*100}%) rotate(${r}deg) scale(${sx},${sy})`;
  el.style.opacity = o.o ?? 1;
  const b = o.b ?? 0; el.style.filter = b > .15 ? `blur(${b.toFixed(2)}px)` : 'none';
  if (o.z != null) el.style.zIndex = o.z;
}
function show(el, on){ el.style.display = on ? '' : 'none'; }
// words → inline-block spans. '\n' = line break. Returns {el, ws}
function words(parent, text, cls, css){
  const el = mk('div', cls || 'a d', parent, css);
  const ws = [];
  text.split('\n').forEach((line, li) => {
    if (li) el.appendChild(document.createElement('br'));
    line.split(' ').forEach((w, wi) => {
      if (wi) el.appendChild(document.createTextNode(' '));
      ws.push(mk('span', 'w', el, null, w));
    });
  });
  return { el, ws };
}
// blur-in of a single word, p 0..1 (and negative-going for out)
function fw(span, p, dy = .35){
  span.style.opacity = clamp(p*1.3);
  span.style.filter = p < .98 ? `blur(${((1-p)*16).toFixed(1)}px)` : 'none';
  span.style.transform = `translateY(${((1-p)*dy).toFixed(3)}em) scale(${(.92+.08*p).toFixed(3)})`;
}
// typewriter: ghost holds the full width so text grows left→right without re-centering
function typer(parent, text, css){
  const el = mk('div', 'a d', parent, css);
  mk('span', 'ghost', el, null, text);
  const ty = mk('span', 'typed', el);
  return { el, set(n, t, curOn = true){
    n = Math.floor(n);
    const blink = (n < text.length && n > 0) || (Math.floor(t*2.2) % 2 === 0);
    ty.innerHTML = text.slice(0, n).replace(/&/g,'&amp;') + (curOn ? `<span class="cur" style="opacity:${blink?1:0}"></span>` : '');
  }};
}
const ICONS = {
  chat:'<path d="M5 6h22a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H14l-6 5v-5H5a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z"/>',
  spark:'<path d="M16 3v8M16 21v8M3 16h8M21 16h8M7 7l5 5M20 20l5 5M25 7l-5 5M12 20l-5 5"/>',
  dots:'<circle cx="8" cy="16" r="2.4"/><circle cx="16" cy="16" r="2.4"/><circle cx="24" cy="16" r="2.4"/>',
  cursor:'<path d="M7 4l18 10-8 2-3 8z"/>',
  brain:'<path d="M12 5a5 5 0 0 0-5 5 5 5 0 0 0-2 9 5 5 0 0 0 7 6h1V5zM20 5a5 5 0 0 1 5 5 5 5 0 0 1 2 9 5 5 0 0 1-7 6h-1V5z"/>',
  bolt:'<path d="M18 3L7 18h8l-2 11 12-16h-8z"/>',
  heart:'<path d="M16 27S4 19.5 4 11.5A6 6 0 0 1 16 9a6 6 0 0 1 12 2.5C28 19.5 16 27 16 27z"/>',
  kbd:'<rect x="3" y="8" width="26" height="16" rx="3"/><path d="M8 13h1M13 13h1M18 13h1M23 13h1M10 19h12"/>',
  mic:'<rect x="12" y="3" width="8" height="15" rx="4"/><path d="M7 14a9 9 0 0 0 18 0M16 23v6M11 29h10"/>',
  mem:'<path d="M9 4h14v24l-7-5-7 5z"/>',
  check:'<path d="M6 17l6 6L26 9"/>',
  key:'<circle cx="11" cy="16" r="6"/><path d="M17 16h12M25 16v5M29 16v4"/>',
  slash:'<circle cx="16" cy="16" r="11"/><path d="M8 8l16 16"/>',
  star:'<path d="M16 3v26M3 16h26M7 7l18 18M25 7L7 25"/>',
  moon:'<path d="M24 20A11 11 0 0 1 12 6a11 11 0 1 0 12 14z"/>',
  hex:'<path d="M16 4l10 6v12l-10 6-10-6V10z"/><circle cx="16" cy="16" r="4"/>',
};
function icon(parent, name, size, color = C.ink, fill = 'none', sw = 2.4){
  return mk('div', 'ico', parent, `width:${size}px;height:${size}px`,
    `<svg viewBox="0 0 32 32" width="${size}" height="${size}" fill="${fill}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`);
}
const WM_PATH = 'M59.4 202.8Q45.8 202.8 35.5 199.7Q25.2 196.6 18.2 190.7Q11.2 184.8 7.9 176.3Q4.6 167.8 5 157.2L32 151.4Q32 161.4 35.8 167.4Q39.6 173.4 46.2 176.2Q52.8 179 60.6 179Q67.6 179 72.9 177.2Q78.2 175.4 81.2 172.2Q84.2 169 84.2 164.6Q84.2 159 80.2 155.6Q76.2 152.2 69.5 149.9Q62.8 147.6 54.6 145.6Q46 143.2 37.5 140.4Q29 137.6 22 133.3Q15 129 10.7 122.1Q6.4 115.2 6.4 104.8Q6.4 92.4 12.8 83.6Q19.2 74.8 30.4 70Q41.6 65.2 56.4 65.2Q71.8 65.2 83.7 70.4Q95.6 75.6 102 85.5Q108.4 95.4 107.2 110L80.6 114.4Q81 108.2 79.4 103.4Q77.8 98.6 74.6 95.2Q71.4 91.8 66.6 90.1Q61.8 88.4 55.4 88.4Q48.6 88.4 43.9 90.2Q39.2 92 36.8 95.3Q34.4 98.6 34.4 103Q34.4 108 38 111.2Q41.6 114.4 48.1 116.6Q54.6 118.8 63 121Q71.6 123.2 80.2 126Q88.8 128.8 96.2 133.4Q103.6 138 108 145.2Q112.4 152.4 112.4 163.6Q112.4 176.4 105.6 185.2Q98.8 194 86.9 198.4Q75 202.8 59.4 202.8Z M326.6 202.8Q315.6 202.8 306.8 200.3Q298 197.8 291.5 193.1Q285 188.4 280.7 181.7Q276.4 175 274.3 166.6Q272.2 158.2 272.2 148.4V68H301V146.8Q301 157.2 304.1 163.9Q307.2 170.6 312.9 173.8Q318.6 177 326.6 177Q334.8 177 340.5 173.8Q346.2 170.6 349.2 163.9Q352.2 157.2 352.2 146.8V68H381.2V148.4Q381.2 174.4 367.2 188.6Q353.2 202.8 326.6 202.8Z M408.8 200V68H437.6V175.2H490V200Z';
// Glass-O wordmark (from brand/logo/svg/soul-wordmark*.svg); eyes in their own group so they can blink
function wordmark(parent, width, dark){
  const h = width * 144.35 / 489.04;
  const el = mk('div', 'a', parent, `width:${width}px;height:${h}px`,
    `<svg viewBox="2.96 61.82 489.04 144.35" width="${width}" height="${h}">
      <path fill="${dark ? '#F6F3EC' : '#16181D'}" d="${WM_PATH}"/>
      ${dark ? '<circle cx="190.2" cy="134" r="70.18" fill="#CBCDCF"/><circle cx="190.2" cy="134" r="64.21" fill="#0B0B0C"/>'
             : '<circle cx="190.2" cy="134" r="70.18" fill="#0B0B0C"/>'}
      <g class="eyes" style="transform-origin:190px 128px;transform-box:view-box"><path fill="#FFF0C8" d="${dark
        ? 'M180.82 125.78A12.84 21.83 0 1 1 160.14 121.91ZM220.26 121.91A12.84 21.83 0 1 1 199.58 125.78Z'
        : 'M179.94 125.01A14.04 23.86 0 1 1 157.34 120.78ZM223.06 120.78A14.04 23.86 0 1 1 200.46 125.01Z'}"/></g></svg>`);
  el.eyes = el.querySelector('.eyes'); el.h = h; return el;
}

/* ───────────────────────── assets ───────────────────────── */
const R9 = '../renders/v9/soul_v9_', MED = '../site/media/';
const IMG = {
  hero:   {src:R9+'hero.png',     w:1600, h:1200, f:[795,585]},
  hand:   {src:R9+'hand.png',     w:1600, h:1200, f:[805,580]},
  family: {src:R9+'family.png',   w:2000, h:1125, f:[1000,560]},
  night:  {src:R9+'ou_night.png', w:1600, h:1200, f:[776,616]},
};
const SCREEN = n => ({src:MED+`os-${n}.jpg`, w:628, h:719, c:[314.5,330.5], r:245});
const POSTER = n => ({src:MED+`posters/${n}.jpg`, w:540, h:540, c:[270,270], r:196});

// image card (rounded rect, cover crop around focus, `span` = visible image px across)
function imgCard(parent, im, w, h, span, focus){
  const k = w / span, f = focus || im.f;
  return mk('div', 'imgc', parent, `width:${w}px;height:${h}px;background-image:url(${im.src});
    background-size:${im.w*k}px ${im.h*k}px;background-position:${w/2 - f[0]*k}px ${h/2 - f[1]*k}px`);
}
// circular crop of a round screen
function circCrop(parent, sc, d){
  const k = d / (2*sc.r);
  return mk('div', 'circ', parent, `background-image:url(${sc.src});background-size:${sc.w*k}px ${sc.h*k}px;
    background-position:${-(sc.c[0]-sc.r)*k}px ${-(sc.c[1]-sc.r)*k}px`);
}
// device face: aluminium ring + black glass; returns {el, glass}
function face(parent, d){
  const rd = d * 1.17, el = mk('div', 'ring', parent, `width:${rd}px;height:${rd}px`);
  const glass = mk('div', 'glass', el, `width:${d}px;height:${d}px;left:${(rd-d)/2}px;top:${(rd-d)/2}px`);
  return { el, glass };
}
// full-bleed photo with ken-burns: view centre (vx,vy) in image px, zoom z (1 = cover)
class Photo {
  constructor(parent, im, w = cw, h = ch, free = false){ this.im = im; this.w = w; this.h = h; this.free = free;
    this.el = mk('img', 'ph', parent, `width:${im.w}px;height:${im.h}px`); this.el.src = im.src; }
  set(z, vx, vy){
    const im = this.im, S = Math.max(this.w/im.w, this.h/im.h) * z;
    let l = this.w/2 - vx*S, t = this.h/2 - vy*S;
    if (!this.free){ l = Math.min(0, Math.max(this.w - im.w*S, l)); t = Math.min(0, Math.max(this.h - im.h*S, t)); }
    this.S = S; this.l = l; this.t = t;
    this.el.style.transform = `translate(${l}px,${t}px) scale(${S})`;
  }
  map(x, y){ return [this.l + x*this.S, this.t + y*this.S]; }
}
// tap ripple: fingertip press + 3 expanding glow rings
function ripple(parent, color){
  const g = mk('div', 'a', parent);
  const rings = [0,1,2].map(() => mk('div', 'rip', g, color ? `border-color:${color}` : ''));
  const dot = mk('div', 'tapdot', g);
  return { g, set(lt, x, y, size){ // lt = seconds since tap
    show(g, lt > -.35 && lt < 1.3);
    const press = seg(lt, -.35, 0), lift = seg(lt, .05, .35);
    dot.style.width = dot.style.height = size*.34 + 'px';
    P(dot, x, y, { s: lerp(1.5, .9, eo(press)) * lerp(1, 1.3, lift), o: eo(press) * (1 - lift) });
    rings.forEach((r, i) => { const p = seg(lt, i*.12, .9 + i*.12);
      r.style.width = r.style.height = size + 'px';
      P(r, x, y, { s: lerp(.25, 1.6, eo(p)), o: (p > 0 ? 1 : 0) * (1 - p) }); });
  }};
}

/* ───────────────────────── SOUL eyes (canvas) ───────────────────────── */
// st: lx,ly (-1..1 look), blink 0..1, wide 0..1, happy 0..1, blush 0..1
function drawEyes(cv, st){
  const D = cv.width, ctx = cv.getContext('2d'), R = D/2;
  ctx.clearRect(0, 0, D, D);
  const g = ctx.createRadialGradient(R*.7, R*.6, R*.05, R, R, R);
  g.addColorStop(0, '#1c1b1f'); g.addColorStop(1, '#050506');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(R, R, R, 0, 7); ctx.fill();
  const lx = (st.lx||0)*R*.15, ly = (st.ly||0)*R*.10, b = st.blink||0, w = st.wide||0, hp = st.happy||0;
  for (const side of [-1, 1]){
    const ex = R + side*R*.307 + lx, ey = R + R*.043 + ly;
    const rx = R*.2*(1 + .2*w), ry = R*.34*(1 + .1*w)*(1 - .9*b);
    if (hp < 1){
      ctx.save(); ctx.globalAlpha = 1 - hp;
      // lid cut: line sloping down toward the nose (from the logo), lifts when eyes go wide
      const k = ry / (R*.34), lift = w*R*.16;
      const ix = -side*R*.161, iy = -R*.171*k - lift, ox = side*R*.161, oy = -R*.231*k - lift;
      const yAt = dx => iy + (oy - iy) * (dx - ix) / (ox - ix);
      ctx.beginPath(); ctx.moveTo(ex - R*.5, ey + yAt(-R*.5)); ctx.lineTo(ex + R*.5, ey + yAt(R*.5));
      ctx.lineTo(ex + R*.5, ey + R); ctx.lineTo(ex - R*.5, ey + R); ctx.closePath(); ctx.clip();
      ctx.shadowColor = 'rgba(255,226,160,.6)'; ctx.shadowBlur = R*.14;
      ctx.fillStyle = C.eye; ctx.beginPath(); ctx.ellipse(ex, ey, rx, Math.max(ry, R*.02), 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    if (hp > 0){
      ctx.save(); ctx.globalAlpha = hp; ctx.strokeStyle = C.eye; ctx.lineWidth = R*.085; ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(255,226,160,.6)'; ctx.shadowBlur = R*.12;
      ctx.beginPath(); ctx.arc(ex, ey + R*.06, R*.15, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = `rgba(236,110,104,${.6*(st.blush||0)})`;
      ctx.beginPath(); ctx.ellipse(ex + side*R*.05, ey + R*.2, R*.1, R*.05, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
  }
}
function eyesCanvas(parent, d){ const f = face(parent, d); const cv = mk('canvas', null, f.glass); cv.width = cv.height = d; f.cv = cv; return f; }

/* ───────────────────────── backgrounds (low-res canvas = cheap blur) ───────────────────────── */
const fbg = document.getElementById('fbg'), cbg = document.getElementById('cbg');
function drawFrameBg(t){
  const w = fbg.width, h = fbg.height, x = fbg.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0E0A0E'); g.addColorStop(.28, '#2A0F25'); g.addColorStop(.58, '#6A2045');
  g.addColorStop(.82, '#D1604A'); g.addColorStop(1, '#FFB073');
  x.filter = 'none'; x.fillStyle = g; x.fillRect(0, 0, w, h);
  const blob = (bx, by, r, c) => { const rg = x.createRadialGradient(bx, by, 0, bx, by, r);
    rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = rg; x.fillRect(0, 0, w, h); };
  blob(w*(.5 + .25*Math.sin(t*.35)), h*1.02, w*.55, 'rgba(255,190,110,.55)');
  blob(w*(.08 + .05*Math.sin(t*.5+1)), h*.62, w*.35, 'rgba(178,52,120,.45)');
  blob(w*(.92 + .05*Math.cos(t*.43)), h*.55, w*.35, 'rgba(200,70,110,.40)');
  blob(w*.5, -h*.1, w*.5, 'rgba(0,0,0,.5)');
}
function drawCardBg(t){
  const w = cbg.width, h = cbg.height, x = cbg.getContext('2d');
  x.filter = 'none';
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#FFFDFB'); g.addColorStop(.55, '#FBF4EE'); g.addColorStop(1, '#F7E7DE');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  const blob = (bx, by, r, c) => { const rg = x.createRadialGradient(bx, by, 0, bx, by, r);
    rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = rg; x.fillRect(0, 0, w, h); };
  blob(w*(.86 + .04*Math.sin(t*.4)), h*(.12 + .04*Math.cos(t*.3)), w*.45, 'rgba(255,210,170,.55)');
  blob(w*(.10 + .04*Math.cos(t*.37)), h*(.30 + .05*Math.sin(t*.33)), w*.40, 'rgba(236,214,238,.55)');
  // wavy glow at the bottom
  x.filter = `blur(${Math.round(w/90)}px)`;
  const cols = [['rgba(255,186,120,.62)','rgba(246,178,200,.55)','rgba(255,206,150,.6)'],
                ['rgba(240,190,230,.45)','rgba(255,196,140,.5)','rgba(255,170,150,.45)'],
                ['rgba(255,214,170,.55)','rgba(252,190,206,.45)','rgba(255,182,110,.55)']];
  for (let i = 0; i < 3; i++){
    const base = h*(pick(.80, .84) + .045*i);
    x.beginPath(); x.moveTo(0, h);
    for (let xx = 0; xx <= w; xx += 3){
      const u = xx / w;
      x.lineTo(xx, base + Math.sin(u*Math.PI*2*1.4 + t*.9 + i*2.1)*h*.045 + Math.sin(u*Math.PI*2*3.3 - t*1.3 + i)*h*.022);
    }
    x.lineTo(w, h); x.closePath();
    const lg = x.createLinearGradient(0, 0, w, 0);
    const c = cols[i]; const sh = (Math.sin(t*.3 + i) + 1)/2;
    lg.addColorStop(0, c[0]); lg.addColorStop(clamp(.35 + .2*sh), c[1]); lg.addColorStop(1, c[2]);
    x.fillStyle = lg; x.fill();
  }
  x.filter = 'none';
}
// warm clouds (CTA)
function drawClouds(cv, t){
  const w = cv.width, h = cv.height, x = cv.getContext('2d');
  x.filter = 'none';
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#F3C9AE'); g.addColorStop(.45, '#FBE2CF'); g.addColorStop(1, '#FFF4E8');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  const sun = x.createRadialGradient(w*.68, h*.28, 0, w*.68, h*.28, w*.45);
  sun.addColorStop(0, 'rgba(255,200,120,.75)'); sun.addColorStop(1, 'rgba(255,200,120,0)');
  x.fillStyle = sun; x.fillRect(0, 0, w, h);
  x.filter = `blur(${Math.max(1, Math.round(w/130))}px)`;
  const r = rng(7);
  for (let i = 0; i < 46; i++){
    const yy = h*(.25 + .9*r()), sc = .5 + yy/h, spd = 4 + 10*sc;
    let xx = ((r()*1.4 - .2)*w + t*spd*w/400) % (w*1.4); if (xx > w*1.2) xx -= w*1.4;
    const rad = w*(.05 + .07*r())*sc;
    for (let j = 0; j < 5; j++){
      const px = xx + (j - 2)*rad*.6, py = yy - Math.sin(j/4*Math.PI)*rad*.45, rr = rad*(.6 + .4*Math.sin(j/4*Math.PI));
      const cg = x.createRadialGradient(px, py - rr*.3, rr*.1, px, py, rr);
      cg.addColorStop(0, 'rgba(255,253,250,.95)'); cg.addColorStop(.6, 'rgba(255,240,230,.75)'); cg.addColorStop(1, 'rgba(244,200,180,0)');
      x.fillStyle = cg; x.beginPath(); x.arc(px, py, rr, 0, 7); x.fill();
    }
  }
  x.filter = 'none';
}

/* ───────────────────────── render(t) ───────────────────────── */
window.render = function(t){
  drawFrameBg(t);
  drawCardBg(t);
  const cin = eo(seg(t, 0, .8));
  card.style.transform = `scale(${lerp(.93, 1, cin)})`; card.style.opacity = clamp(cin*1.5);
  for (const sc of SCENES){
    const on = t >= sc.a && t < sc.b;
    sc.root.style.display = on ? '' : 'none';
    if (!on) continue;
    const lt = t - sc.a, dur = sc.b - sc.a;
    // constant subtle push-in + a small punch on each cut
    const s = 1 + .028*(1 - eo(seg(lt, 0, .45))) + .018*(lt/dur);
    sc.root.style.transform = `scale(${s})`; CUR_S = s;
    sc.upd(lt, sc.st, t);
  }
  document.getElementById('fade').style.opacity = ci(seg(t, 48.2, T_END));
  return true;
};

  window.READY = true;
  if (Q.get('play')){ const t0 = performance.now(); const loop = () => { render(((performance.now() - t0)/1000) % T_END); requestAnimationFrame(loop); }; loop(); }
  else if (Q.get('t')) render(parseFloat(Q.get('t')));
})();
</script>
</body>
</html>
