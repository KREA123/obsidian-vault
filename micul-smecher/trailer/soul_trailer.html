<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOUL trailer v4</title>
<!-- SOUL trailer v4. A deterministic, frame-addressable page: render(t) draws the frame at video time t (seconds).
     render.py steps it frame by frame with Playwright and encodes the PNGs. ?v=1 = vertical 1080x1920 (re-laid-out,
     same timeline). ?a=<dir>/ = asset folder (default assets/). Product images are Blender cut-outs (renders/v9,
     CGI); the eyes and UI on the glass are drawn live onto the glass outline projected from the render camera. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#16181D;--amber:#E8890C;--paper:#FAF8F3;--cream:#FFF0C8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#FAF8F3;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#FAF8F3}
#bg{position:absolute;left:0;top:0;width:100%;height:100%}
#grain{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.05;mix-blend-mode:multiply;pointer-events:none}
.scene{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,filter}
.a{position:absolute;left:0;top:0;transform-origin:0 0}
.txt{position:absolute;left:0;top:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:650;color:var(--ink);
  letter-spacing:-.028em;line-height:1.02;white-space:nowrap;font-variation-settings:"opsz" 96}
.txt .ln{display:block}
.txt .w{display:inline-block;will-change:transform,filter,opacity}
.prod{position:absolute;left:0;top:0;transform-origin:0 0}
.prod img{position:absolute;left:0;top:0;display:block}
.prod canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.shadow{position:absolute;left:0;top:0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(58,40,28,.42),rgba(58,40,28,.18) 55%,rgba(58,40,28,0) 100%)}
.floor{position:absolute;left:0;width:100%;
  background:linear-gradient(to bottom,rgba(236,222,206,0),rgba(236,222,206,.55) 18%,rgba(229,212,194,.75) 100%)}
.pill{position:absolute;left:0;top:0;display:flex;align-items:center;gap:.42em;white-space:nowrap;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:600;color:var(--ink);letter-spacing:-.02em;
  background:rgba(255,255,255,.92);border-radius:999px;padding:.42em .9em .46em .72em;
  box-shadow:0 .5em 1.4em rgba(60,40,25,.13),0 .08em .25em rgba(60,40,25,.10),inset 0 0 0 1px rgba(255,255,255,.7)}
.pill .dot{width:.5em;height:.5em;border-radius:50%;flex:none}
.pill.dark{background:#16181D;color:#FAF8F3}
.card{position:absolute;left:0;top:0;background:rgba(255,255,255,.95);border-radius:34px;
  box-shadow:0 34px 70px rgba(60,40,25,.16),0 8px 20px rgba(60,40,25,.08);font-family:'DM Sans',sans-serif;color:var(--ink)}
.chat{position:absolute;left:0;top:0;background:#fff;border-radius:999px;display:flex;align-items:center;
  box-shadow:0 30px 70px rgba(60,40,25,.14),0 6px 16px rgba(60,40,25,.08),inset 0 0 0 2px rgba(22,24,29,.06);
  font-family:'DM Sans',sans-serif;color:var(--ink);font-weight:500;letter-spacing:-.01em}
.chat .tx{flex:1;white-space:nowrap;overflow:hidden}
.chat .caret{display:inline-block;width:.06em;height:1.05em;background:var(--ink);vertical-align:-.16em;margin-left:.04em}
.chat .send{flex:none;border-radius:50%;background:#16181D;display:flex;align-items:center;justify-content:center}
.btn{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;gap:.5em;white-space:nowrap;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:600;letter-spacing:-.02em;border-radius:999px;
  background:#16181D;color:#FAF8F3;box-shadow:0 22px 50px rgba(22,24,29,.25),0 4px 12px rgba(22,24,29,.15)}
.logo{position:absolute;left:0;top:0;transform-origin:50% 50%}
.logo svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.ripple{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none}

.disc{position:absolute;left:0;top:0;border-radius:50%;background:linear-gradient(150deg,#FFFFFF,#E4E0DA 38%,#C8C5C0 62%,#F2F0EC);
  box-shadow:0 30px 60px rgba(60,40,25,.20),0 8px 18px rgba(60,40,25,.12),inset 0 1px 0 rgba(255,255,255,.9)}
.disc i{position:absolute;inset:6%;border-radius:50%;background-color:#050506;background-size:95.7% 95.7%;background-position:center;background-repeat:no-repeat;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
#cgi{position:absolute;font-family:'DM Sans',sans-serif;font-size:15px;color:rgba(22,24,29,.42);letter-spacing:.02em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="scenes"></div>
  <canvas id="grain"></canvas>
  <div id="cgi">CGI concept render</div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const V = Q.get('v') === '1';
const AB = Q.get('a') || 'assets/';
document.write('<script src="' + AB + 'manifest.js"><\/script>');
</script>
<script>
'use strict';
/* ============================== frame / timeline ============================== */
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const L = (h, v) => V ? v : h;                   // pick the horizontal / vertical layout value
const BEAT = 7.004 / 16;                         // the music bed's beat (~137.07 BPM); audio.py uses the same grid
const b = n => n * BEAT;
const T_END = b(108);                            // 47.28 s
window.T_END = T_END;
// scene cuts, all on the beat grid (beats): they match the music edit and the VO in audio.py
const CUT = [0, 12, 20, 28, 36, 40, 44, 50, 56, 64, 74, 80, 92, 102, 108].map(b);
// VO line starts (s) -- text for a line enters with its voice
const VO = { meet: b(2), little: b(6), every: b(12), chat: b(17), brain: b(20), now: b(24), desk: b(29), always: b(36),
  looks: b(40.5), hold: b(44), type: b(50.7), talk: b(52.3), remember: b(53.8), asks: b(56), approve: b(60),
  works: b(64), claude: b(68.3), five: b(74), egg: b(80), price: b(92.5), wait: b(99), romania: b(102.6) };

/* ============================== math / easing ============================== */
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, p) => a + (c - a) * p;
const seg = (t, a, d) => clamp((t - a) / d);
const eo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);             // expo out
const ei = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);              // expo in
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const bo = (p, s = 1.25) => p >= 1 ? 1 : 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);   // back out (small overshoot)
function bezier(x1, y1, x2, y2) {                                   // CSS cubic-bezier
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = u => ((ax * u + bx) * u + cx) * u, Y = u => ((ay * u + by) * u + cy) * u, dX = u => (3 * ax * u + 2 * bx) * u + cx;
  return p => { if (p <= 0) return 0; if (p >= 1) return 1; let u = p;
    for (let i = 0; i < 8; i++) { const e = X(u) - p; if (Math.abs(e) < 1e-6) break; u -= e / (dX(u) || 1e-6); }
    return Y(clamp(u)); };
}
const ez = bezier(.2, .8, .2, 1);                                    // the house ease
// keyframe track: keys [[t, v], ...] (v number or array); holds each value, eases from the previous over `d`
function trk(t, keys, d = .3, f = eio) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [tk, vk] = keys[i]; if (t < tk) break;
    const p = f(seg(t, tk, keys[i][2] ?? d));
    v = Array.isArray(vk) ? vk.map((x, j) => lerp(v[j], x, p)) : lerp(v, vk, p);
  }
  return v;
}
const env = (t, a, d1, c, d2) => Math.min(eo(seg(t, a, d1)), 1 - seg(t, c, d2));   // in at a, out at c
function rngf(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const nz = (t, s = 0) => Math.sin(t * 1.7 + s) * .6 + Math.sin(t * 2.9 + s * 1.3) * .4;    // smooth deterministic wobble

/* ============================== DOM helpers ============================== */
const stage = document.getElementById('stage'), scenesEl = document.getElementById('scenes');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
function mk(tag, cls, parent, css, html) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css;
  if (html != null) e.innerHTML = html; (parent || stage).appendChild(e); return e;
}
const fx = v => v.toFixed(2);
function setT(el, tf, o = 1, blur = 0) {
  el.style.transform = tf; el.style.opacity = fx(clamp(o));
  el.style.filter = blur > .25 ? `blur(${fx(blur)}px)` : 'none';
  el.style.visibility = o <= .002 ? 'hidden' : 'visible';
}
// place an element so that its (ax, ay) fraction sits at (x, y)
function P(el, x, y, o = {}) {
  const s = o.s ?? 1, r = o.r ?? 0, ax = o.ax ?? .5, ay = o.ay ?? .5;
  if (!el._w) { el._w = el.offsetWidth; el._h = el.offsetHeight; } const w = el._w, h = el._h;
  setT(el, `translate(${fx(x)}px,${fx(y)}px) rotate(${fx(r)}deg) scale(${(o.sx ?? s).toFixed(4)},${(o.sy ?? s).toFixed(4)}) translate(${fx(-ax * w)}px,${fx(-ay * h)}px)`,
       o.o ?? 1, o.b ?? 0);
}

/* ============================== scenes ============================== */
const SCN = [];
class Scene {
  constructor(i, o = {}) {
    this.t0 = CUT[i]; this.t1 = CUT[i + 1]; this.el = mk('div', 'scene', scenesEl, `width:${W}px;height:${H}px`);
    this.pre = o.pre ?? 0; this.post = o.post ?? 0; this.drift = o.drift ?? .035; SCN.push(this);
  }
  on(t) { return t >= this.t0 - this.pre && t < this.t1 + this.post; }
  // the scene camera: slow push-in over the scene + an optional transform (whip / zoom) supplied by the scene
  cam(t, extra = {}) {
    const p = seg(t, this.t0, this.t1 - this.t0), s = (1 + this.drift * ez(p)) * (extra.s ?? 1);
    setT(this.el, `translate(${fx(extra.x ?? 0)}px,${fx(extra.y ?? 0)}px) scale(${s.toFixed(4)})`, extra.o ?? 1, extra.b ?? 0);
  }
}
// standard transitions: whip out (fast slide + blur) and the matching whip in
const whipOut = (t, t1, dx = -1, dy = 0, d = .2) => { const q = ei(seg(t, t1 - d, d)); return { x: dx * q * 260, y: dy * q * 260, b: q * 26, o: 1 - q }; };
const whipIn = (t, t0, dx = 1, dy = 0, d = .34) => { const q = 1 - eo(seg(t, t0, d)); return { x: dx * q * 220, y: dy * q * 220, b: q * 22, o: t < t0 ? 0 : 1 - q * .6 }; };
const zoomOut = (t, t1, d = .22) => { const q = ei(seg(t, t1 - d, d)); return { s: 1 + .28 * q, b: q * 24, o: 1 - q }; };
const zoomIn = (t, t0, d = .4) => { const q = 1 - eo(seg(t, t0, d)); return { s: 1 - .1 * q, b: q * 18, o: t < t0 ? 0 : 1 - q * .8 }; };
const comb = (...xs) => xs.reduce((a, c) => ({ x: (a.x ?? 0) + (c.x ?? 0), y: (a.y ?? 0) + (c.y ?? 0), s: (a.s ?? 1) * (c.s ?? 1),
  b: (a.b ?? 0) + (c.b ?? 0), o: (a.o ?? 1) * (c.o ?? 1) }), {});

/* ============================== kinetic type ============================== */
// '*word*' = accent (amber), '\n' = line break. One line of copy per idea; words blur + rise in, exit fast together.
class Text {
  constructor(parent, src, o = {}) {
    this.o = Object.assign({ size: 132, ax: .5, ay: .5, align: 'center', color: null, acc: null, stagger: .075, dur: .42 }, o);
    this.el = mk('div', 'txt', parent, `font-size:${this.o.size}px;text-align:${this.o.align};${this.o.color ? 'color:' + this.o.color : ''};${o.weight ? 'font-weight:' + o.weight : ''}`);
    this.ws = [];
    src.split('\n').forEach(line => {
      const ln = mk('span', 'ln', this.el);
      line.split(' ').forEach((w, i) => {
        if (i) ln.appendChild(document.createTextNode(' '));
        const acc = /^\*.*\*[.,!?]?$/.test(w);
        const sp = mk('span', 'w', ln, null, acc ? w.replace(/\*/g, '') : w);
        sp._acc = acc; this.ws.push(sp);
      });
    });
  }
  // tin: entry start, tout: exit start (exit lasts .2 s), x,y: anchor position, a: extra {x,y,s,o,b} for the block
  set(t, tin, tout, x, y, a = {}) {
    const vis = t >= tin - .01 && t < tout + .22;
    this.el.style.display = vis ? '' : 'none'; if (!vis) return;
    P(this.el, x + (a.x ?? 0), y + (a.y ?? 0), { ax: this.o.ax, ay: this.o.ay, s: a.s ?? 1, o: a.o ?? 1, b: a.b ?? 0 });
    const q = seg(t, tout, .2), qe = ei(q), sz = this.o.size;
    this.ws.forEach((w, i) => {
      const p = seg(t, tin + i * this.o.stagger, this.o.dur), e = eo(p);
      const o = clamp(p * 3.2) * (1 - q);
      const ty = (1 - e) * sz * .42 - qe * sz * .14, bl = (1 - e) * 16 + qe * 14, sc = 1 + qe * .04;
      setT(w, `translate(0,${fx(ty)}px) scale(${sc.toFixed(4)})`, o, bl);
      if (w._acc) w.style.color = this.o.acc ?? (a.accP == null ? 'var(--amber)' : mixc('#16181D', '#E8890C', a.accP));
    });
  }
}
function mixc(c1, c2, p) {
  const h = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)), A = h(c1), B2 = h(c2);
  return `rgb(${A.map((v, i) => Math.round(lerp(v, B2[i], clamp(p)))).join(',')})`;
}

/* ============================== background ============================== */
const bg = document.getElementById('bg'), bctx = bg.getContext('2d');
bg.width = V ? 216 : 384; bg.height = V ? 384 : 216;
const BLOBS = [   // fx, fy (fraction of the frame), r (fraction of the long side), colour, drift phase
  [.08, 1.02, .42, [255, 214, 186], 0], [.92, 1.04, .40, [226, 218, 247], 1.7], [.55, 1.10, .30, [255, 232, 178], 3.1],
  [.98, .04, .24, [255, 226, 206], 4.2, .5], [.0, .06, .2, [232, 226, 248], 5.3, .5]];
function drawBg(t, night) {
  const w = bg.width, h = bg.height, n = clamp(night), R = Math.max(w, h);
  const g = bctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, mixc('#FBF9F5', '#120D16', n)); g.addColorStop(1, mixc('#FCF5EE', '#1B1016', n));
  bctx.globalCompositeOperation = 'source-over'; bctx.fillStyle = g; bctx.fillRect(0, 0, w, h);
  for (const [bx, by, br, c, ph, ka = 1] of BLOBS) {
    const x = (bx + .035 * Math.sin(t * .23 + ph)) * w, y = (by + .03 * Math.cos(t * .19 + ph * 1.3)) * h, r = br * R * (1 + .06 * Math.sin(t * .3 + ph));
    const k = (1 - n * .85) * ka, gr = bctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${c},${.85 * k})`); gr.addColorStop(.55, `rgba(${c},${.35 * k})`); gr.addColorStop(1, `rgba(${c},0)`);
    bctx.fillStyle = gr; bctx.fillRect(0, 0, w, h);
  }
  if (n > 0) {   // night: a warm glow where the egg stands
    const gx = L(.6, .5) * w, gy = L(.62, .66) * h, r = .55 * R, gr = bctx.createRadialGradient(gx, gy, 0, gx, gy, r);
    const k = n * (.85 + .15 * Math.sin(t * 2.1));
    gr.addColorStop(0, `rgba(255,170,90,${.55 * k})`); gr.addColorStop(.35, `rgba(214,98,44,${.22 * k})`); gr.addColorStop(1, 'rgba(120,40,30,0)');
    bctx.fillStyle = gr; bctx.fillRect(0, 0, w, h);
  }
}
(function grain() {   // static film grain (dithers the gradients against 8-bit banding)
  const c = document.getElementById('grain'), w = c.width = Math.round(W / 2), h = c.height = Math.round(H / 2), x = c.getContext('2d');
  const im = x.createImageData(w, h), r = rngf(11);
  for (let i = 0; i < w * h; i++) { const v = 128 + (r() - .5) * 110; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  x.putImageData(im, 0, 0);
})();

/* ============================== the SOUL face (port of the SoulOS eye renderer, os/index.html) ============================== */
const TAU = Math.PI * 2;
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const PAL = { blush: hex('#FF7A9A'), mint: hex('#C9F2E4'), ice: hex('#9FC6FF'), amber: hex('#FFB347'), cream: hex('#FFF0C8') };
function ellipsePts(cx, cy, rx, ry, n) { const a = []; for (let i = 0; i < n; i++) { const t = i / n * TAU; a.push([cx + Math.cos(t) * rx, cy + Math.sin(t) * ry]); } return a; }
function clipHalf(pts, fn) {
  const out = [], n = pts.length;
  for (let i = 0; i < n; i++) { const a = pts[i], c = pts[(i + 1) % n], fa = fn(a), fb = fn(c);
    if (fa >= 0) out.push(a);
    if ((fa >= 0) !== (fb >= 0)) { const t = fa / (fa - fb); out.push([a[0] + (c[0] - a[0]) * t, a[1] + (c[1] - a[1]) * t]); } }
  return out;
}
function poly(ctx, pts) { if (pts.length < 3) return; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); }
function glow(ctx, c, a, r) { ctx.shadowColor = rgba(c, a); ctx.shadowBlur = r; }
function noGlow(ctx) { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; }
function drawZ(ctx, x, y, s) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x + s, y + s); ctx.stroke(); }
function drawEye(ctx, f, e, side, S, cx0, cy0, col) {
  const par = 1 - .07 * f.gx * side;
  const ex = cx0 + (side * f.spacing + f.gx * .055 + e.dx) * S, ey = cy0 + (f.cy + f.gy * .06 + e.dy) * S;
  const rx = f.eyeW * e.scale * par * S, ry0 = f.eyeH * e.scale * par * S;
  const squint = 1 - .85 * Math.max(f.happy, f.styleAmt), ry = ry0 * Math.max(0, e.open) * squint;
  const B = f.bright, G = S * .075 * f.glow, wN = (1 - f.happy) * (1 - f.styleAmt);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (wN > .01 && ry > .6) {
    const k = Math.tan(e.lidTilt) * (-side), yTop = ey + (-1 + 2 * e.lidTop) * ry;
    const lid = p => p[1] - (yTop + k * (p[0] - ex));
    const pts = clipHalf(ellipsePts(ex, ey, rx, ry, 72), lid);
    ctx.globalAlpha = wN * B; ctx.fillStyle = rgba(col, 1); glow(ctx, col, .62, G); poly(ctx, pts); noGlow(ctx);
    const hx = ex + rx * .22, hy = ey - ry * .12, hrx = rx * .34, hry = ry * .46;
    if (hry > .8) { ctx.globalAlpha = .45 * wN * B; ctx.fillStyle = '#fff'; poly(ctx, clipHalf(ellipsePts(hx, hy, hrx, hry, 40), lid)); }
  }
  const th = .042 * S; ctx.strokeStyle = rgba(col, 1);
  if (f.happy > .01) { ctx.globalAlpha = f.happy * (1 - f.styleAmt) * B; ctx.lineWidth = th; glow(ctx, col, .6, G);
    ctx.beginPath(); ctx.arc(ex, ey + ry0 * .45, rx, Math.PI + .35, TAU - .35); ctx.stroke(); noGlow(ctx); }
  if (f.styleAmt > .01) { ctx.globalAlpha = f.styleAmt * B; glow(ctx, col, .6, G); ctx.lineWidth = th * .85;   // 'closed' (asleep)
    ctx.beginPath(); ctx.arc(ex, ey - ry0 * .25, rx * .95, .35, Math.PI - .35); ctx.stroke(); noGlow(ctx); }
  if (f.blush > .01) { ctx.globalAlpha = .55 * f.blush * B; ctx.fillStyle = rgba(PAL.blush, 1); glow(ctx, PAL.blush, .4, S * .04);
    ctx.beginPath(); ctx.ellipse(ex + side * rx * .25, ey + f.eyeH * S * 1.02, rx * .85, f.eyeH * S * .24, 0, 0, TAU); ctx.fill(); noGlow(ctx); }
}
function drawFace(ctx, S, f, cx, cy, t) {
  const col = f.color;
  drawEye(ctx, f, f.L, -1, S, cx, cy, col); drawEye(ctx, f, f.R, 1, S, cx, cy, col);
  if (f.zzz > .01) { const drift = (t * .25) % 1, a = (.55 + .45 * Math.sin(t * 2)) * f.zzz * f.bright, th = .018 * S;
    ctx.strokeStyle = rgba(col, 1); ctx.lineWidth = th; ctx.globalAlpha = a; glow(ctx, col, .5, S * .03);
    drawZ(ctx, cx + .25 * S, cy - (.21 + .04 * drift) * S, .065 * S); ctx.lineWidth = th * .8; ctx.globalAlpha = a * .8;
    drawZ(ctx, cx + .34 * S, cy - (.31 + .04 * drift) * S, .045 * S); noGlow(ctx); }
  const R = S / 2;
