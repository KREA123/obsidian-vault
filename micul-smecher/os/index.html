<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoulOS</title>
<meta name="description" content="Interactive prototype of SoulOS, the round interface of SOUL.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Martian+Mono:wght@300..600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E4E6E1; --surface:#EFF0EC; --ink:#161819; --muted:#5A615F; --line:#C9CDC6;
  --chip:#F7F7F3; --chip-ink:#161819; --on:#161819; --on-ink:#F3F1E8;
  --amber-ink:#9A5A00; --mint-ink:#1D6E54;
  --peb-hi:rgba(255,255,255,.96); --peb-mid:rgba(233,236,236,.92); --peb-lo:rgba(190,196,198,.95); --peb-edge:rgba(150,158,160,.9);
  --peb-shadow:rgba(40,46,44,.28);
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* device (always AMOLED) */
  --cream:#FFF0C8; --amber:#FFB347; --mint:#C9F2E4; --ice:#9FC6FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0D0D; --surface:#141717; --ink:#ECEAE2; --muted:#8C9490; --line:#262B2A;
    --chip:#191D1C; --chip-ink:#ECEAE2; --on:#ECEAE2; --on-ink:#0B0D0D;
    --amber-ink:#FFB347; --mint-ink:#C9F2E4;
    --peb-hi:rgba(236,240,240,.92); --peb-mid:rgba(196,202,204,.9); --peb-lo:rgba(140,148,150,.92); --peb-edge:rgba(96,104,106,.95);
    --peb-shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0D0D; --surface:#141717; --ink:#ECEAE2; --muted:#8C9490; --line:#262B2A;
  --chip:#191D1C; --chip-ink:#ECEAE2; --on:#ECEAE2; --on-ink:#0B0D0D;
  --amber-ink:#FFB347; --mint-ink:#C9F2E4;
  --peb-hi:rgba(236,240,240,.92); --peb-mid:rgba(196,202,204,.9); --peb-lo:rgba(140,148,150,.92); --peb-edge:rgba(96,104,106,.95);
  --peb-shadow:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.top{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 0}
.brand{font:500 17px/1 var(--display);letter-spacing:.01em;display:flex;align-items:center;gap:10px}
@media (max-width:480px){.brand small{display:none}}
.brand small{font:400 12px/1 var(--mono);color:var(--muted);letter-spacing:.02em}
.mark{width:22px;height:22px;border-radius:50%;background:#000;position:relative;flex:none;box-shadow:0 0 0 3px var(--peb-mid)}
.mark::before,.mark::after{content:"";position:absolute;top:6px;width:4px;height:9px;border-radius:3px;background:var(--cream);box-shadow:0 0 4px rgba(255,240,200,.8)}
.mark::before{left:6px}.mark::after{right:6px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font:500 13px/1 var(--mono);color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}

.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:56px;padding-block:24px 48px;align-items:start}
@media (max-width:920px){.wrap{grid-template-columns:minmax(0,1fr);gap:28px}}

.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0}
@media (max-width:920px){.stage{position:static}}
/* SOUL size M (the current product): 90 x 103 x 31 mm bead-blasted, anodised aluminium, seen from the front.
   Same drawing as the landing page's .stone: a soft, almost square pebble (90:103) whose round black glass (Ø74 mm)
   fills 82.5 % of the width; nothing else on the front. The side button sits on the right flank. */
.pebble{position:relative;width:min(440px,calc(100% - 24px));aspect-ratio:90/103;max-width:100%;transition:transform .12s}
.body{position:absolute;inset:0;pointer-events:none;border-radius:36% 36% 31% 31% / 32% 32% 27% 27%;
  background:radial-gradient(120% 100% at 32% 14%,#FFFFFF 0%,#EFF1F3 32%,#D3D6DA 64%,#AEB2B8 100%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.95),inset 0 -9px 0 -3px rgba(60,64,70,.16),inset 0 -14px 24px rgba(30,34,42,.22),0 26px 50px -16px var(--peb-shadow),0 4px 10px rgba(22,24,29,.12)}
:root[data-kbd] .glass:has(.screen:focus){outline:2px dashed rgba(90,97,95,.55);outline-offset:12px}
.pebble.buzz{animation:buzz .32s linear 2}
.pebble.tick{animation:tick .14s ease-out 1}
@keyframes tick{0%,100%{transform:translate(0,0)}35%{transform:translate(-1px,.5px)}70%{transform:translate(1px,-.5px)}}
@keyframes buzz{0%,100%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,1px)}}
.glass{position:absolute;left:8.75%;width:82.5%;top:10.05%;aspect-ratio:1;border-radius:50%;background:#000;
  box-shadow:0 0 0 2px #0b0c0f,0 0 0 4px rgba(255,255,255,.6),inset 0 0 18px rgba(0,0,0,.9)}
.screen{position:absolute;left:0;top:0;width:466px;height:466px;transform-origin:0 0;border-radius:50%;overflow:hidden;background:#000;
  color:var(--cream);font-family:var(--display);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;outline:none}
.glass::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 30%,transparent 42%)}
.side{position:absolute;right:-4px;top:34%;width:8px;height:11%;border-radius:5px;border:0;cursor:pointer;padding:0;touch-action:none;
  background:linear-gradient(90deg,#8d9398,#e9ecee 55%,#b4babe);box-shadow:1px 2px 4px var(--peb-shadow),inset 0 0 0 1px rgba(80,86,90,.5)}
.side:active,.side.down{transform:translateX(-2px)}
#face{position:absolute;inset:0;width:466px;height:466px;display:block}

.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:0;font-size:13px;color:var(--muted);max-width:540px}
.keys span{white-space:nowrap}
kbd{font:500 11px/1 var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;background:var(--surface);color:var(--ink)}

/* ================= SoulOS 3 · design language "Orbit" =================
   A round black face with two living eyes. Nothing on the glass is a panel, a card, a tile or a toggle:
   everything is something SOUL says (big words under the eyes) or holds up (one thin line glyph),
   and the rim is the dial: words orbit along it and you spin them with a finger.
   One light at a time: cream = idle/info · ice = listening · amber = Claude / needs you · mint = done.
   Type: Bricolage Grotesque (the voice) + Martian Mono (the rim). Glyphs: 24-grid, one 2 px stroke, round caps. */
.screen{--fs-hero:104px;--fs-xl:64px;--fs-l:34px;--fs-m:27px;--fs-s:22px;--fs-xs:19px;
  --v:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;--r:"Martian Mono",ui-monospace,monospace;
  --dim:rgba(255,240,200,.56);--faint:rgba(255,240,200,.3);--hair:rgba(255,240,200,.12);--spring:cubic-bezier(.34,1.56,.64,1);
  font-family:var(--v);font-variation-settings:"opsz" 96}
#cards{position:absolute;inset:0}
.card{position:absolute;inset:0;will-change:transform,opacity;transform-origin:233px 150px;backface-visibility:hidden}
.card.leaving{pointer-events:none}
.c{position:absolute;left:68px;right:68px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
/* rim words: set on the circle with SVG textPath (top arc = titles and status, bottom arc = the orbit) */
.rim{position:absolute;inset:0;width:466px;height:466px;pointer-events:none;overflow:visible}
.rim text{font:400 15px/1 var(--r);letter-spacing:.16em;text-transform:uppercase;fill:var(--dim)}
.rim .amber{fill:var(--amber)}.rim .mint{fill:var(--mint)}.rim .ice{fill:var(--ice)}.rim .cream{fill:var(--cream)}
.rim .say{font:560 26px/1 var(--v);letter-spacing:0;text-transform:none}
.rim [data-act]{pointer-events:auto;cursor:pointer}
.rim .hit{fill:none;stroke:transparent;stroke-width:46;pointer-events:stroke;cursor:pointer}
.rimlbl{transition:opacity .3s}
/* while the orbit shows where you are, the app gives the rim back: its content fades out beyond r = 172 */
@property --mr{syntax:"<length>";inherits:false;initial-value:300px}
.card:not([data-v="apps"]){--mr:300px;-webkit-mask-image:radial-gradient(circle at 233px 233px,#000 var(--mr),transparent calc(var(--mr) + 18px));mask-image:radial-gradient(circle at 233px 233px,#000 var(--mr),transparent calc(var(--mr) + 18px));transition:--mr .45s cubic-bezier(.2,.8,.2,1)}
.screen.navhint .card:not(.leaving){--mr:170px}
.screen.has-pill .rimlbl,.screen.has-pill .clock{opacity:0}
.t1{font:560 34px/1.12 var(--v);text-wrap:balance;letter-spacing:-.01em}
.t2{font:420 27px/1.2 var(--v);text-wrap:balance}
.t3{font:400 22px/1.25 var(--v);color:var(--dim);text-wrap:balance}
.mono{font-family:var(--r)}
.clock{transition:opacity .3s}
#cards{transition:opacity .45s ease}
.screen.asleep #cards,.screen.cc-on #cards{opacity:0}
/* actions are spoken words: no pill, no fill, no border. A thin line under the word says "touch me". */
.chips{display:flex;flex-wrap:wrap;gap:4px 26px;justify-content:center}
.chip{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 4px;font:560 24px/1 var(--v);color:var(--cream);white-space:nowrap;background:none;border:0}
.chip::after{content:"";position:absolute;left:4px;right:4px;bottom:9px;height:2px;border-radius:1px;background:currentColor;opacity:.4}
.chip.ok{color:var(--mint)}.chip.warn{color:var(--amber)}.chip.ice{color:var(--ice)}
.chip:not(.btn)::after{display:none}
.chip:not(.btn){font-weight:420;font-size:22px}
.chip.btn{cursor:pointer}
.lg{display:block;flex:none;overflow:visible}
.lg *{vector-effect:non-scaling-stroke}
.tool{font:400 15px/1 var(--r);letter-spacing:.06em;color:rgba(159,198,255,.8)}
.dots{position:absolute;inset:0;display:block;transition:opacity .35s;pointer-events:none;z-index:2}
.dots.hide{opacity:0}
/* notifications: words that orbit in along the top rim; the eyes look up at them */
.pill{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;transform:rotate(38deg);transform-origin:233px 233px;
  transition:transform .75s cubic-bezier(.2,1.1,.3,1),opacity .4s ease}
.pill.show{opacity:1;transform:rotate(0deg)}
.pill svg{position:absolute;inset:0;width:466px;height:466px;overflow:visible}
.pill text{font:560 23px/1 var(--v);fill:var(--cream)}
.pill .who{font:400 14px/1 var(--r);letter-spacing:.16em;text-transform:uppercase;fill:var(--dim)}
.pill .ln{fill:none;stroke:var(--cream);stroke-width:3;stroke-linecap:round;opacity:.55}
.pill.amber text:not(.who){fill:var(--amber)}.pill.amber .ln{stroke:var(--amber);opacity:.9}
.pill.mint text:not(.who){fill:var(--mint)}.pill.mint .ln{stroke:var(--mint);opacity:.8}
.pill .hit{fill:none;stroke:transparent;stroke-width:64;pointer-events:stroke;cursor:pointer}
.pill.ghost{z-index:6;pointer-events:none;transition:transform .7s cubic-bezier(.2,1,.3,1),opacity .7s ease}
.pill.ghost .hit,.pill:not(.show) .hit{pointer-events:none}
/* lists: a time on the rim font, the words in the voice font; no rows, no boxes */
.list{position:absolute;top:150px;left:74px;right:74px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.list li{display:flex;align-items:center;gap:14px;min-height:62px;padding:0 4px;text-align:left;position:relative}
.list .tm{font:400 16px/1 var(--r);letter-spacing:.04em;color:var(--dim);flex:none;width:62px;font-variant-numeric:tabular-nums}
.list .tx{font:420 24px/1.15 var(--v);flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.list li.col{flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;padding:8px 4px}
.list .ck{width:30px;height:30px;flex:none;color:var(--faint)}
.list li.done .tx{color:rgba(255,240,200,.4);text-decoration:line-through;text-decoration-color:rgba(201,242,228,.6);text-decoration-thickness:2px}
.list li.done .ck{color:var(--mint)}
.list li.new::before{content:"";position:absolute;left:-16px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.list .st{font:400 13px/1 var(--r);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);flex:none}
.list .st.ok{color:var(--mint)}
.ring{position:absolute;inset:0;width:466px;height:466px;pointer-events:none}
.fdig{font:500 104px/1 var(--v);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cmd{font:400 25px/1.2 var(--r);color:var(--cream);max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em}
.langs{display:flex;align-items:center;gap:18px}
.lp{font:560 34px/1 var(--v);color:var(--faint)}
.lp.a{color:var(--cream)}
.swap{width:56px;height:56px;display:grid;place-items:center;cursor:pointer;color:var(--cream)}
.ctrls{display:flex;gap:30px;align-items:center}
.cb{width:64px;height:64px;display:grid;place-items:center;cursor:pointer;color:var(--cream)}
.cb.big{width:84px;height:84px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--cream)}
.set{position:absolute;top:150px;left:84px;right:84px;display:flex;flex-direction:column}
.set div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;height:54px;align-items:center;cursor:pointer}
.set span{font:420 25px/1 var(--v)}
.set b{font:400 15px/1 var(--r);letter-spacing:.08em;text-transform:uppercase;color:var(--mint)}
.set b.dim{color:var(--dim)}
.fade-in{animation:fin .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes fin{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}
.caret{display:inline-block;width:3px;height:1em;background:var(--ice);vertical-align:-.12em;margin-left:3px;animation:blink 1s steps(2) infinite;border-radius:1px}
@keyframes blink{50%{opacity:0}}

/* ---------- keyboard: the same Round QWERTY geometry, but letters, not keycaps ---------- */
#kb{position:absolute;inset:0;display:none;z-index:3;font-family:var(--v)}
#kb.on{display:block}
.kf{position:absolute;left:72px;right:72px;top:56px;height:72px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  text-align:center;font:460 28px/36px var(--v);color:var(--cream);overflow-wrap:anywhere;white-space:pre-wrap}
.kf .ph{color:rgba(255,240,200,.36)}
.kf u{text-decoration:none;box-shadow:inset 0 -3px 0 var(--mint)}
.kf .dz{color:var(--ice)}
.kcar{display:inline-block;width:3px;height:29px;background:var(--ice);vertical-align:-6px;margin:0 1px;animation:blink 1s steps(2) infinite;border-radius:1px}
.kcnt{position:absolute;right:92px;top:44px;font:400 13px/1 var(--r);color:var(--dim)}
.ks{position:absolute;top:134px;height:46px;display:flex;align-items:center;justify-content:center;padding:0 8px;
  font:420 25px/1 var(--v);color:rgba(255,240,200,.66);white-space:nowrap;overflow:hidden}
.ks span{overflow:hidden;text-overflow:ellipsis}
.ks.b{color:var(--cream);font-weight:620}
.ks.ctx{color:var(--cream);font-size:22px;font-weight:520}
.ks.ctx span{box-shadow:inset 0 -2px 0 rgba(255,240,200,.4);padding-bottom:3px}
.ks.tm,.ks.un{color:var(--mint);font-size:22px;font-weight:560}
.ks.tm span,.ks.un span{box-shadow:inset 0 -2px 0 rgba(201,242,228,.55);padding-bottom:3px}
.ks i{font-style:normal;color:var(--mint)}
.ksep{position:absolute;top:150px;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.kbk::before{content:"";position:absolute;left:30px;right:30px;top:182px;height:1px;background:linear-gradient(90deg,transparent,var(--hair) 18%,var(--hair) 82%,transparent)}
.kk{position:absolute;height:46px;color:rgba(255,240,200,.95);display:grid;place-items:center;
  font:460 28px/1 var(--v);transition:color .06s,opacity .15s;white-space:nowrap;overflow:hidden}
.kk::after{content:"";position:absolute;left:50%;bottom:3px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--hair)}
.kk.fn{color:var(--dim);font:400 14px/1 var(--r);letter-spacing:.06em}
.kk.fn::after,.kk.sp::after{display:none}
.kk.sp{color:var(--faint);font:400 13px/1 var(--r);letter-spacing:.14em;box-shadow:inset 0 -2px 0 -0px transparent}
.kk.sp::before{content:"";position:absolute;left:10px;right:10px;bottom:9px;height:2px;border-radius:1px;background:var(--faint)}
.kk.on{color:#fff}
.kk.lit{color:var(--cream)}
.kk.lock{box-shadow:inset 0 -2px 0 var(--cream)}
.kk.send{color:var(--amber)}
.kk.save{color:var(--mint)}
.kk.send svg,.kk.save svg{width:34px;height:34px;padding:6px;border-radius:50%;box-shadow:inset 0 0 0 2px currentColor;stroke-width:2.6}
.kk.dis{opacity:.35}
.kk.off{opacity:.4}
.kk svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kk.lit svg path.fl{fill:currentColor}
.kbk.hide .kk{opacity:0}
.kcall{position:absolute;width:58px;height:66px;display:grid;place-items:center;pointer-events:none;
  font:560 40px/1 var(--v);color:var(--cream);text-shadow:0 0 14px rgba(255,240,200,.5)}
.kcall::before{content:"";position:absolute;left:1px;top:5px;width:56px;height:56px;border-radius:50%;background:#000;box-shadow:inset 0 0 0 2px var(--cream);z-index:-1}
.ktray{position:absolute;height:60px;display:flex;border-radius:30px;background:#000;box-shadow:inset 0 0 0 2px var(--cream),0 0 0 6px #000;padding:5px;pointer-events:none}
.ktray b{width:44px;height:48px;display:grid;place-items:center;font:560 29px/1 var(--v);color:var(--cream);border-radius:50%}
.ktray b.sel{color:#000;background:var(--cream)}
.kdl{position:absolute;left:0;right:0;top:196px;text-align:center;font:400 15px/1 var(--r);letter-spacing:.2em;text-transform:uppercase;color:var(--ice)}
.kstop{position:absolute;left:163px;width:140px;top:352px;height:52px;color:var(--ice);display:flex;align-items:center;justify-content:center;gap:10px;font:560 24px/1 var(--v)}
.kstop i{width:14px;height:14px;box-shadow:inset 0 0 0 2px var(--ice);border-radius:2px}

/* ---------- apps: "+ new", alarms, Rim-Dial ---------- */
.addb{position:absolute;top:104px;left:330px;width:66px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--mint)}
.addb small{font:400 11px/1 var(--r);letter-spacing:.16em;text-transform:uppercase}
.alist li{justify-content:space-between;min-height:70px}
.ainfo{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;cursor:pointer}
.ainfo b{font:500 40px/1 var(--v);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ainfo b.off{color:rgba(255,240,200,.34)}
.ainfo small{font:400 13px/1.1 var(--r);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tog{min-width:58px;height:52px;display:flex;align-items:center;justify-content:flex-end;gap:7px;cursor:pointer;flex:none;font:400 14px/1 var(--r);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.tog i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor}
.tog.on{color:var(--mint)}
.tog.on i{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.ddig{position:absolute;left:0;right:0;text-align:center;font:500 104px/1 var(--v);font-variant-numeric:tabular-nums;color:rgba(255,240,200,.34);letter-spacing:-.03em}
.ddig span{cursor:pointer;display:inline-block;padding:0 2px 6px}
.ddig span.a{color:var(--cream);box-shadow:inset 0 -3px 0 -1px rgba(255,240,200,.9)}
.drel{position:absolute;left:0;right:0;text-align:center;font:400 14px/1 var(--r);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

const lg = (k, s = 24, w = s >= 60 ? 2.5 : 2, st = "") => `<svg class="lg" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${(w * 24 / s).toFixed(3)}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${st ? ` style="${st}"` : ""}>${GP[k] || ""}</svg>`;
/* rim words: #rT runs clockwise over the top (text outside the path), #rB runs left→right through 6 o'clock (text inside) */
const arcPath = (r, span, top) => { const a0 = (top ? -90 - span / 2 : 90 + span / 2) * Math.PI / 180, a1 = (top ? -90 + span / 2 : 90 - span / 2) * Math.PI / 180;
  return `M${(233 + r * Math.cos(a0)).toFixed(2)} ${(233 + r * Math.sin(a0)).toFixed(2)}A${r} ${r} 0 1 ${top ? 1 : 0} ${(233 + r * Math.cos(a1)).toFixed(2)} ${(233 + r * Math.sin(a1)).toFixed(2)}`; };
function rimDefs() { return `<path id="rT" d="${arcPath(198, 250, 1)}"/><path id="rB" d="${arcPath(201, 250, 0)}"/><path id="rO" d="${arcPath(203, 250, 0)}"/><path id="rP" d="${arcPath(197, 250, 1)}"/>`; }
const rimTxt = (href, inner, cls = "", deg = 0, act = "") => `<g transform="rotate(${deg} 233 233)"${act}><text class="${cls}"><textPath href="#${href}" startOffset="50%" text-anchor="middle">${inner}</textPath></text></g>`;
const rimTop = (inner, cls = "", box = "rimlbl") => `<svg class="rim ${box}" viewBox="0 0 466 466">${rimTxt("rT", inner, cls)}</svg>`;
const rimBot = (inner, cls = "", box = "") => `<svg class="rim ${box}" viewBox="0 0 466 466">${rimTxt("rB", inner, cls)}</svg>`;
const lbl = (t, cls = "") => rimTop(esc(t), cls);
const dateShort = () => new Date().toLocaleDateString(LANG === "ro" ? "ro-RO" : "en-GB", { weekday: "short", day: "numeric" }).replace(/[.,]/g, "");
/* an arc on the rim (angles in degrees, 0 = 3 o'clock, clockwise) */
function arcD(a0, a1, r = 223) {

  return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} ${a1 > a0 ? 1 : 0} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}

/* ---------------------------------------------------------------- navigation (spring-driven cards) */
let curCard = null, NAV = null;
function layoutFor(v) {
  if (v === "voice") { const V = S.voice; return V && V.phase === "answer" ? LAYOUT.answer : LAYOUT.listen; }
  if (v === "games" && S.game.run) return LAYOUT.game;
  if (["home", "talk", "today", "focus", "dial", "alarmsum", "ring", "apps"].includes(v)) return LAYOUT[v];
  return LAYOUT.card;
}
function applyFaceState() {
  const v = S.view;
  soul.layDirect = false;
  if (S.kb && !S.sleeping) {
    soul.lay = Object.assign({ cx: 0 }, S.kb.dict ? LAYOUT.kbdict : LAYOUT.kb);
    soul.st = S.kb.dict ? "listen" : "idle"; soul.alert = false; return;
  }
  let lay = Object.assign({ cx: 0 }, layoutFor(v));
  if (S.pill && lay.k < 0.9 && lay.cy < -0.3) { lay.cy += 0.025; }        // the notification rides the top rim: the eyes duck a little under it
  if (S.sleeping) lay = Object.assign({ cx: 0 }, LAYOUT.sleep);
  else if (S.chgShow && v === "home") lay = Object.assign({ cx: 0 }, LAYOUT.chg);
  if (screen.classList.contains("cc-on") && !S.sleeping) lay = Object.assign({ cx: 0 }, LAYOUT.cc);
  soul.lay = lay;
  /* one light at a time: the eyes take the colour of the state (ice = listening, amber = Claude / AI at work, cream = everything else) */
  soul.tint = S.sleeping ? PAL.cream : v === "voice" && S.voice && S.voice.phase === "listen" ? PAL.ice
    : (v === "voice" && S.voice && S.voice.phase === "think" && S.ai !== "none") || (v === "claude" && S.claude.pending) || (v === "ring" && S.ringWake) ? PAL.amber : PAL.cream;
  if (S.sleeping) { soul.st = "sleep"; return; }
  if (v === "voice") soul.st = S.voice.phase === "listen" ? "listen" : S.voice.phase === "think" ? "think" : S.voice.speaking ? "speak" : "idle";
  else if (v === "focus" && S.focus.run) soul.st = "focus";
  else if (v === "claude" && !S.claude.pending) soul.st = "busy";
  else if (v === "ring") soul.st = S.ringWake ? "idle" : "sleep";
  else soul.st = "idle";

      <div class="tbtns"><span class="tb ${!sw.run && !t ? "dis" : ""}" data-act="sw-lap" role="button" aria-label="lap">${sw.run || !t ? TG.flag : TG.reset}</span><span class="tb ${sw.run ? "stop" : "go"}" data-act="sw-go" role="button" aria-label="start">${sw.run ? TG.pause : TG.play}</span></div>`;
  }

    (cd.done ? `<div class="wxc" style="top:282px;color:var(--mint)">${esc(L.cdDone)}</div>` : cd.run ? "" : `<div class="tpre">${[1, 3, 5, 10].map(m => `<span data-act="cd-pre" data-m="${m}" class="${cd.total === m * 60 ? "on" : ""}">${m}′</span>`).join("")}</div>`) +
    `<div class="tbtns"><span class="tb" data-act="cd-reset" role="button" aria-label="reset">${TG.reset}</span><span class="tb ${cd.run ? "stop" : "go"}" data-act="cd-go" role="button" aria-label="start">${cd.run ? TG.pause : TG.play}</span></div>`;
}
let tmSec = -1;

/* ================================================================ Games: catch the star (the eyes follow every star) */
const STAR = `<svg viewBox="0 0 24 24" aria-hidden="true" fill="rgba(255,215,107,.16)" stroke="#FFD76B" stroke-width="1.1" stroke-linejoin="round">${GP.star}</svg>`;
const GAME_T = 25;
function gamesHTML() {
  const L = T(), G = S.game, C = 2 * Math.PI * 222;
  if (G.run) return `<svg class="ring" viewBox="0 0 466 466" aria-hidden="true"><circle cx="233" cy="233" r="222" fill="none" stroke="rgba(159,198,255,.14)" stroke-width="8"/><circle data-live="gring" cx="233" cy="233" r="222" fill="none" stroke="#9FC6FF" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - G.left / GAME_T)).toFixed(1)}" transform="rotate(-90 233 233)" style="filter:drop-shadow(0 0 6px rgba(159,198,255,.6))"/></svg><div class="gscore" data-live="gs">${G.score}</div><div class="gfield"></div>`;
  if (G.over) return `${lbl(L.gOver)}<div class="gover">${G.score}<span style="font-size:44px;color:#FFD76B"> ★</span></div>
    <div class="c" style="top:280px;gap:10px"><div class="t3" style="${G.newBest ? "color:var(--mint)" : ""}">${esc(G.newBest ? L.newBest : L.best(G.best))}</div>${wordBtn("game-start", L.again.replace(/^\S+\s/, ""))}</div>`;
  return `${lbl(L.games)}<div class="gtile" data-act="game-start" role="button">${STAR}<b>${esc(L.g1)}</b><small>${esc(L.g1d)}</small><em>${esc(L.play.replace(/^\S+\s/, ""))}</em></div><div class="gbest">${esc(G.best ? L.best(G.best) : L.noBest)}</div>`;
}
function gameStart() {
  Object.assign(S.game, { run: true, over: false, score: 0, left: GAME_T, t: 0, stars: [], next: 0.7, streak: 0, newBest: false });
  sfx("open"); hap("light"); soul.react("wake"); refresh(); applyFaceState();
}
function gameSpawn() {
  const G = S.game, field = S.view === "games" && curCard && curCard.querySelector(".gfield");
  let x = 233, y = 233;
  for (let i = 0; i < 24; i++) { const a = rnd(0, TAU), r = rnd(118, 186); x = 233 + Math.cos(a) * r; y = 233 + Math.sin(a) * r; if (y > 132 && !G.stars.some(s => Math.hypot(s.x - x, s.y - y) < 96)) break; }
  const st = { id: ++G.id, x, y, born: G.t, life: Math.max(0.85, 1.75 - G.score * 0.05) };
  if (field) { const el = document.createElement("span"); el.className = "gstar"; el.style.left = (x - 32).toFixed(0) + "px"; el.style.top = (y - 32).toFixed(0) + "px"; el.style.transform = "scale(0)"; el.innerHTML = STAR; field.appendChild(el); st.el = el; }

function gameFx(x, y, cls, txt) { const f = curCard && curCard.querySelector(".gfield"); if (!f) return; const e = document.createElement(cls === "gplus" ? "b" : "i"); e.className = cls; e.style.left = x.toFixed(0) + "px"; e.style.top = y.toFixed(0) + "px"; if (txt) e.textContent = txt; f.appendChild(e); setTimeout(() => e.remove(), 850); }
function gameCatch(st) {
  const G = S.game; G.stars = G.stars.filter(s => s !== st); if (st.el) st.el.remove();
  G.score++; G.streak++;
  gameFx(st.x, st.y, "gburst"); gameFx(st.x, st.y - 10, "gplus", "+1");
  sfx("star"); hap("light");
  if (G.streak % 5 === 0) soul.react("star", 1.2); else soul.react("happy", 0.6);
  const s = curCard && curCard.querySelector('[data-live="gs"]'); if (s) s.textContent = G.score;
}
function gameMiss(st) { const G = S.game; G.stars = G.stars.filter(s => s !== st); if (st.el) st.el.remove(); G.streak = 0; sfx("miss"); soul.react("nope", 0.7); }
function gameTap(p) { const G = S.game; let best = null, bd = 52; for (const st of G.stars) { const d = Math.hypot(st.x - p.x, st.y - p.y); if (d < bd) { bd = d; best = st; } } if (best) gameCatch(best); }

  const G = S.game; G.run = false; G.stars.forEach(s => s.el && s.el.remove()); G.stars = [];
  if (silent) { G.over = false; return; }
  G.over = true; G.newBest = G.score > G.best;
  if (G.newBest) { G.best = G.score; try { localStorage.setItem("soulos-best", String(G.best)); } catch (e) {} }
  addDiary("game");
  soul.react(G.newBest ? "star" : "happy", 2.4); sfx(G.newBest ? "fanfare" : "chime"); hap("double");
  if (S.view === "games") refresh(); applyFaceState();
}
function gameFrame(dt) {
  const G = S.game; if (!G.run) return;
  G.t += dt; G.left -= dt;
  if (G.left <= 0) { gameEnd(); return; }
  if (G.t >= G.next && G.stars.length < (G.score >= 8 ? 2 : 1)) gameSpawn();
  for (const st of G.stars.slice()) {
    const a = (G.t - st.born) / st.life;
    if (a >= 1) { gameMiss(st); continue; }
    if (st.el) { const s = a < 0.12 ? (a / 0.12) * 1.12 : a < 0.2 ? 1.12 - (a - 0.12) / 0.08 * 0.12 : 1 - (a - 0.2) * 0.5; st.el.style.transform = `scale(${s.toFixed(3)}) rotate(${(a * 40).toFixed(1)}deg)`; st.el.style.opacity = a > 0.78 ? ((1 - a) / 0.22).toFixed(2) : "1"; }
  }
  const r = S.view === "games" && curCard && curCard.querySelector('[data-live="gring"]');
