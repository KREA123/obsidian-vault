<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoulOS</title>
<meta name="description" content="Interactive prototype of SoulOS, the round interface of SOUL.">

<style>
:root{
  --bg:#E4E6E1; --surface:#EFF0EC; --ink:#161819; --muted:#5A615F; --line:#C9CDC6;
  --chip:#F7F7F3; --chip-ink:#161819; --on:#161819; --on-ink:#F3F1E8;
  --amber-ink:#9A5A00; --mint-ink:#1D6E54;
  --peb-hi:rgba(255,255,255,.96); --peb-mid:rgba(233,236,236,.92); --peb-lo:rgba(190,196,198,.95); --peb-edge:rgba(150,158,160,.9);
  --peb-shadow:rgba(40,46,44,.28);
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* device (always AMOLED) */
  --cream:#FFF0C8; --amber:#FFB347; --mint:#C9F2E4; --ice:#9FC6FF;
  /* SoulOS 4 · "Orbit" tokens. Page chrome: one accent (SOUL amber, Claude's colour), warm-grey neutrals.
     Type scale 12 · 14 · 16 · 20 · 28 · 40 (page); spacing 4 · 8 · 12 · 16 · 24 · 32; radii 6 (field) · 10 (tile) · pill;
     motion: 120 ms press · 200 ms state · 250 ms max for any navigation, springy (overshoot ≤ 6 %). */
  --accent:#9A5A00; --accent-ink:#FFFFFF; --accent-soft:rgba(154,90,0,.12); --danger:#A33A2A; --ok:#1D6E54;
  --t-xs:12px; --t-s:14px; --t-m:16px; --t-l:20px; --t-xl:28px; --t-2xl:40px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
  --r-s:6px; --r-m:10px; --r-pill:999px;
  --d-press:120ms; --d-state:200ms; --d-nav:250ms; --ease-spring:cubic-bezier(.34,1.4,.64,1); --ease-out:cubic-bezier(.2,.8,.2,1);
  --focus:0 0 0 2px var(--bg),0 0 0 4px var(--ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0D0D; --surface:#141717; --ink:#ECEAE2; --muted:#8C9490; --line:#262B2A;
    --chip:#191D1C; --chip-ink:#ECEAE2; --on:#ECEAE2; --on-ink:#0B0D0D;
    --amber-ink:#FFB347; --mint-ink:#C9F2E4;
    --peb-hi:rgba(236,240,240,.92); --peb-mid:rgba(196,202,204,.9); --peb-lo:rgba(140,148,150,.92); --peb-edge:rgba(96,104,106,.95);
    --peb-shadow:rgba(0,0,0,.6);
    --accent:#FFB347; --accent-ink:#1B1206; --accent-soft:rgba(255,179,71,.14); --danger:#FF8A75; --ok:#C9F2E4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0D0D; --surface:#141717; --ink:#ECEAE2; --muted:#8C9490; --line:#262B2A;
  --chip:#191D1C; --chip-ink:#ECEAE2; --on:#ECEAE2; --on-ink:#0B0D0D;
  --amber-ink:#FFB347; --mint-ink:#C9F2E4;
  --peb-hi:rgba(236,240,240,.92); --peb-mid:rgba(196,202,204,.9); --peb-lo:rgba(140,148,150,.92); --peb-edge:rgba(96,104,106,.95);
  --peb-shadow:rgba(0,0,0,.6);
  --accent:#FFB347; --accent-ink:#1B1206; --accent-soft:rgba(255,179,71,.14); --danger:#FF8A75; --ok:#C9F2E4;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 0}
.brand{font:500 17px/1 var(--display);letter-spacing:.01em;display:flex;align-items:center;gap:10px}
@media (max-width:480px){.brand small{display:none}}
.brand small{font:400 12px/1 var(--mono);color:var(--muted);letter-spacing:.02em}
.mark{width:22px;height:22px;border-radius:50%;background:#000;position:relative;flex:none;box-shadow:0 0 0 3px var(--peb-mid)}
.mark::before,.mark::after{content:"";position:absolute;top:6px;width:4px;height:9px;border-radius:3px;background:var(--cream);box-shadow:0 0 4px rgba(255,240,200,.8)}
.mark::before{left:6px}.mark::after{right:6px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;padding:5px 12px;border-radius:var(--r-pill);cursor:pointer;font:500 13px/1 var(--mono);color:var(--muted);transition:background var(--d-state),color var(--d-state)}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}

.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:56px;padding-block:24px 48px;align-items:start}
@media (max-width:920px){.wrap{grid-template-columns:minmax(0,1fr);gap:28px}}

.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0}
@media (max-width:920px){.stage{position:static}}

.16% 49.39%,0.30% 50.91%,0.48% 52.42%,0.69% 53.94%,0.92% 55.44%,1.16% 56.95%,1.42% 58.45%,1.69% 59.95%,1.99% 61.45%,2.33% 62.94%,2.70% 64.41%,3.10% 65.89%,3.50% 67.36%,3.91% 68.83%,4.31% 70.30%,4.72% 71.77%,5.12% 73.24%,5.53% 74.71%,5.94% 76.18%,6.34% 77.65%,6.75% 79.12%,7.15% 80.59%,7.56% 82.06%,7.97% 83.53%,8.38% 85.00%,8.83% 86.46%,9.32% 87.90%,9.91% 89.31%,10.63% 90.65%,11.50% 91.90%,12.51% 93.04%,13.61% 94.09%,14.79% 95.07%,16.02% 95.96%,17.30% 96.79%,18.61% 97.57%,19.95% 98.31%);

:root[data-kbd] .glass:has(.screen:focus){outline:2px dashed rgba(90,97,95,.55);outline-offset:12px}
.pebble.buzz{animation:buzz .32s linear 2}
.pebble.tick{animation:tick .14s ease-out 1}
@keyframes tick{0%,100%{transform:translate(0,0)}35%{transform:translate(-1px,.5px)}70%{transform:translate(1px,-.5px)}}
@keyframes buzz{0%,100%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,1px)}}
.glass{position:absolute;left:8.75%;width:82.5%;top:10.05%;aspect-ratio:1;border-radius:50%;background:#000;
  box-shadow:0 0 0 2px #0b0c0f,0 0 0 4px rgba(255,255,255,.6),inset 0 0 18px rgba(0,0,0,.9)}
.screen{position:absolute;left:0;top:0;width:466px;height:466px;transform-origin:0 0;border-radius:50%;overflow:hidden;background:#000;
  color:var(--cream);font-family:var(--display);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;outline:none}
.glass::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 30%,transparent 42%)}
.side{position:absolute;right:-4px;top:34%;width:8px;height:11%;border-radius:5px;border:0;cursor:pointer;padding:0;touch-action:none;
  background:linear-gradient(90deg,#8d9398,#e9ecee 55%,#b4babe);box-shadow:1px 2px 4px var(--peb-shadow),inset 0 0 0 1px rgba(80,86,90,.5)}
.side:active,.side.down{transform:translateX(-2px)}
#face{position:absolute;inset:0;width:466px;height:466px;display:block}

.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:0;font-size:13px;color:var(--muted);max-width:540px}
.keys span{white-space:nowrap}
kbd{font:500 11px/1 var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;background:var(--surface);color:var(--ink)}

/* ================= SoulOS 3 · design language "Orbit" =================
   A round black face with two living eyes. Nothing on the glass is a panel, a card, a tile or a toggle:
   everything is something SOUL says (big words under the eyes) or holds up (one thin line glyph),
   and the rim is the dial: words orbit along it and you spin them with a finger.
   One light at a time: cream = idle/info · ice = listening · amber = Claude / needs you · mint = done.
   Type: Bricolage Grotesque (the voice) + Martian Mono (the rim). Glyphs: 24-grid, one 2 px stroke, round caps. */
.screen{--fs-hero:104px;--fs-xl:64px;--fs-l:34px;--fs-m:27px;--fs-s:22px;--fs-xs:19px;
  --v:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;--r:"Martian Mono",ui-monospace,monospace;
  --dim:rgba(255,240,200,.62);--faint:rgba(255,240,200,.42);--hair:rgba(255,240,200,.12);--spring:cubic-bezier(.34,1.56,.64,1);
  font-family:var(--v);font-variation-settings:"opsz" 96}
#cards{position:absolute;inset:0}
.card{position:absolute;inset:0;will-change:transform,opacity;transform-origin:233px 150px;backface-visibility:hidden}
.card.leaving{pointer-events:none}
.c{position:absolute;left:68px;right:68px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
/* rim words: set on the circle with SVG textPath (top arc = titles and status, bottom arc = the orbit) */
.rim{position:absolute;inset:0;width:466px;height:466px;pointer-events:none;overflow:visible}
.rim text{font:400 15px/1 var(--r);letter-spacing:.16em;text-transform:uppercase;fill:var(--dim)}
.rim .amber{fill:var(--amber)}.rim .mint{fill:var(--mint)}.rim .ice{fill:var(--ice)}.rim .cream{fill:var(--cream)}
.rim .say{font:560 26px/1 var(--v);letter-spacing:0;text-transform:none}
.rim [data-act]{pointer-events:auto;cursor:pointer}
.rim .hit{fill:none;stroke:transparent;stroke-width:46;pointer-events:stroke;cursor:pointer}
.rimlbl{transition:opacity .3s}
/* while the orbit shows where you are, the app gives the rim back: its content fades out beyond r = 172 */
@property --mr{syntax:"<length>";inherits:false;initial-value:300px}
.card:not([data-v="apps"]){--mr:300px;-webkit-mask-image:radial-gradient(circle at 233px 233px,#000 var(--mr),transparent calc(var(--mr) + 18px));mask-image:radial-gradient(circle at 233px 233px,#000 var(--mr),transparent calc(var(--mr) + 18px));transition:--mr .25s cubic-bezier(.2,.8,.2,1)}
.screen.navhint .card:not(.leaving){--mr:170px}
.screen.has-pill .rimlbl,.screen.has-pill .clock{opacity:0}
.t1{font:560 34px/1.12 var(--v);text-wrap:balance;letter-spacing:-.01em}
.t2{font:420 27px/1.2 var(--v);text-wrap:balance}
.t3{font:400 22px/1.25 var(--v);color:var(--dim);text-wrap:balance}
.mono{font-family:var(--r)}
.clock{transition:opacity .3s}
#cards{transition:opacity .22s ease}
.screen.asleep #cards,.screen.cc-on #cards{opacity:0}
/* actions are spoken words: no pill, no fill, no border. A thin line under the word says "touch me". */
.chips{display:flex;flex-wrap:wrap;gap:4px 26px;justify-content:center}
.chip{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 4px;font:560 24px/1 var(--v);color:var(--cream);white-space:nowrap;background:none;border:0}
.chip::after{content:"";position:absolute;left:4px;right:4px;bottom:9px;height:2px;border-radius:1px;background:currentColor;opacity:.4}
.chip.ok{color:var(--mint)}.chip.warn{color:var(--amber)}.chip.ice{color:var(--ice)}
.chip:not(.btn)::after{display:none}
.chip:not(.btn){font-weight:420;font-size:22px}
.chip.btn{cursor:pointer}
.lg{display:block;flex:none;overflow:visible}
.lg *{vector-effect:non-scaling-stroke}
.tool{font:400 15px/1 var(--r);letter-spacing:.06em;color:rgba(159,198,255,.8)}
.dots{position:absolute;inset:0;display:block;transition:opacity .2s;pointer-events:none;z-index:2}
.dots.hide{opacity:0}
/* notifications: words that orbit in along the top rim; the eyes look up at them */
.pill{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;transform:rotate(38deg);transform-origin:233px 233px;
  transition:transform .25s cubic-bezier(.3,1.35,.5,1),opacity .18s ease}
.pill.show{opacity:1;transform:rotate(0deg)}
.pill svg{position:absolute;inset:0;width:466px;height:466px;overflow:visible}
.pill text{font:560 23px/1 var(--v);fill:var(--cream)}
.pill .who{font:400 14px/1 var(--r);letter-spacing:.16em;text-transform:uppercase;fill:var(--dim)}
.pill .ln{fill:none;stroke:var(--cream);stroke-width:3;stroke-linecap:round;opacity:.55}
.pill.amber text:not(.who){fill:var(--amber)}.pill.amber .ln{stroke:var(--amber);opacity:.9}
.pill.mint text:not(.who){fill:var(--mint)}.pill.mint .ln{stroke:var(--mint);opacity:.8}
.pill .hit{fill:none;stroke:transparent;stroke-width:64;pointer-events:stroke;cursor:pointer}
.pill.ghost{z-index:6;pointer-events:none;transition:transform .25s cubic-bezier(.2,1,.3,1),opacity .25s ease}
.pill.ghost .hit,.pill:not(.show) .hit{pointer-events:none}
/* lists: a time on the rim font, the words in the voice font; no rows, no boxes */
.list{position:absolute;top:150px;left:74px;right:74px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.list li{display:flex;align-items:center;gap:14px;min-height:62px;padding:0 4px;text-align:left;position:relative}
.list .tm{font:400 16px/1 var(--r);letter-spacing:.04em;color:var(--dim);flex:none;width:62px;font-variant-numeric:tabular-nums}
.list .tx{font:420 24px/1.15 var(--v);flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.list li.col{flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;padding:8px 4px}
.list .ck{width:30px;height:30px;flex:none;color:var(--faint)}
.list li.done .tx{color:rgba(255,240,200,.4);text-decoration:line-through;text-decoration-color:rgba(201,242,228,.6);text-decoration-thickness:2px}
.list li.done .ck{color:var(--mint)}
.list li.new::before{content:"";position:absolute;left:-16px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.list .st{font:400 13px/1 var(--r);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);flex:none}
.list .st.ok{color:var(--mint)}
.ring{position:absolute;inset:0;width:466px;height:466px;pointer-events:none}
.fdig{font:500 104px/1 var(--v);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cmd{font:400 25px/1.2 var(--r);color:var(--cream);max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em}
.langs{display:flex;align-items:center;gap:18px}
.lp{font:560 34px/1 var(--v);color:var(--faint)}
.lp.a{color:var(--cream)}
.swap{width:56px;height:56px;display:grid;place-items:center;cursor:pointer;color:var(--cream)}
.ctrls{display:flex;gap:30px;align-items:center}
.cb{width:64px;height:64px;display:grid;place-items:center;cursor:pointer;color:var(--cream)}
.cb.big{width:84px;height:84px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--cream)}
.set{position:absolute;top:150px;left:84px;right:84px;display:flex;flex-direction:column}
.set div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;height:54px;align-items:center;cursor:pointer}
.set span{font:420 25px/1 var(--v)}
.set b{font:400 15px/1 var(--r);letter-spacing:.08em;text-transform:uppercase;color:var(--mint)}
.set b.dim{color:var(--dim)}
.fade-in{animation:fin .22s cubic-bezier(.3,1.3,.5,1) both}
@keyframes fin{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}
.caret{display:inline-block;width:3px;height:1em;background:var(--ice);vertical-align:-.12em;margin-left:3px;animation:blink 1s steps(2) infinite;border-radius:1px}
@keyframes blink{50%{opacity:0}}

/* ---------- keyboard: the same Round QWERTY geometry, but letters, not keycaps ---------- */
#kb{position:absolute;inset:0;display:none;z-index:3;font-family:var(--v)}
#kb.on{display:block}
.kf{position:absolute;left:72px;right:72px;top:56px;height:72px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  text-align:center;font:460 28px/36px var(--v);color:var(--cream);overflow-wrap:anywhere;white-space:pre-wrap}
.kf .ph{color:rgba(255,240,200,.36)}
.kf u{text-decoration:none;box-shadow:inset 0 -3px 0 var(--mint)}
.kf .dz{color:var(--ice)}

.kcnt{position:absolute;right:92px;top:44px;font:400 13px/1 var(--r);color:var(--dim)}
.ks{position:absolute;top:134px;height:46px;display:flex;align-items:center;justify-content:center;padding:0 8px;
  font:420 25px/1 var(--v);color:rgba(255,240,200,.66);white-space:nowrap;overflow:hidden}

.ks.tm,.ks.un{color:var(--mint);font-size:22px;font-weight:560}
.ks.tm span,.ks.un span{box-shadow:inset 0 -2px 0 rgba(201,242,228,.55);padding-bottom:3px}

.ksep{position:absolute;top:150px;width:4px;height:4px;border-radius:50%;background:var(--faint)}

.kk{position:absolute;height:46px;color:rgba(255,240,200,.95);display:grid;place-items:center;

.kk::after{content:"";position:absolute;left:50%;bottom:3px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--hair)}

.kk svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kk.lit svg path.fl{fill:currentColor}
.kbk.hide .kk{opacity:0}
.kcall{position:absolute;width:58px;height:66px;display:grid;place-items:center;pointer-events:none;
  font:560 40px/1 var(--v);color:var(--cream);text-shadow:0 0 14px rgba(255,240,200,.5)}
.kcall::before{content:"";position:absolute;left:1px;top:5px;width:56px;height:56px;border-radius:50%;background:#000;box-shadow:inset 0 0 0 2px var(--cream);z-index:-1}
.ktray{position:absolute;height:60px;display:flex;border-radius:30px;background:#000;box-shadow:inset 0 0 0 2px var(--cream),0 0 0 6px #000;padding:5px;pointer-events:none}
.ktray b{width:44px;height:48px;display:grid;place-items:center;font:560 29px/1 var(--v);color:var(--cream);border-radius:50%}
.ktray b.sel{color:#000;background:var(--cream)}
.kdl{position:absolute;left:0;right:0;top:196px;text-align:center;font:400 15px/1 var(--r);letter-spacing:.2em;text-transform:uppercase;color:var(--ice)}
.kstop{position:absolute;left:163px;width:140px;top:352px;height:52px;color:var(--ice);display:flex;align-items:center;justify-content:center;gap:10px;font:560 24px/1 var(--v)}
.kstop i{width:14px;height:14px;box-shadow:inset 0 0 0 2px var(--ice);border-radius:2px}

/* ---------- apps: "+ new", alarms, Rim-Dial ---------- */
.addb{position:absolute;top:104px;left:330px;width:66px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--mint)}
.addb small{font:400 11px/1 var(--r);letter-spacing:.16em;text-transform:uppercase}
.alist li{justify-content:space-between;min-height:70px}
.ainfo{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;cursor:pointer}
.ainfo b{font:500 40px/1 var(--v);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ainfo b.off{color:rgba(255,240,200,.34)}
.ainfo small{font:400 13px/1.1 var(--r);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tog{min-width:58px;height:52px;display:flex;align-items:center;justify-content:flex-end;gap:7px;cursor:pointer;flex:none;font:400 14px/1 var(--r);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.tog i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor}
.tog.on{color:var(--mint)}
.tog.on i{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.ddig{position:absolute;left:0;right:0;text-align:center;font:500 104px/1 var(--v);font-variant-numeric:tabular-nums;color:rgba(255,240,200,.34);letter-spacing:-.03em}
.ddig span{cursor:pointer;display:inline-block;padding:0 2px 6px}
.ddig span.a{color:var(--cream);box-shadow:inset 0 -3px 0 -1px rgba(255,240,200,.9)}
.drel{position:absolute;left:0;right:0;text-align:center;font:400 14px/1 var(--r);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.dok{position:absolute;left:193px;width:80px;height:60px;display:grid;place-items:center;cursor:pointer;color:var(--mint)}
.dok svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;padding:12px;box-sizing:content-box;border-radius:50%;box-shadow:inset 0 0 0 2px currentColor}
.wd{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;display:grid;place-items:center;font:400 14px/1 var(--r);letter-spacing:.04em;color:var(--faint);cursor:pointer}
.wd.on{color:var(--cream);font-weight:600}
.wd.on::after{content:"";position:absolute;bottom:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--cream);box-shadow:0 0 6px var(--cream)}
.dlab{position:absolute;left:0;right:0;text-align:center;font:400 13px/1 var(--r);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.dtag{font:400 13px/1.2 var(--r);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.nrow{cursor:pointer}
/* ---------- SoulOS 4: the brain's answers, first boot, My SOUL, large text ---------- */
.aerr{font:400 14px/1.35 var(--r);letter-spacing:.02em;color:var(--amber);max-width:300px;text-wrap:balance}
.brar{font:400 15px/1 var(--r);letter-spacing:.14em;text-transform:uppercase}
.msub{font:400 13px/1.4 var(--r);letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.bwait{font:400 15px/1 var(--r)!important;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)!important;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.set.tight div{height:46px}
/* a brain list: the name in the voice, its status in the rim font under it */
.set.two{left:96px;right:96px;gap:2px}
.set.two div{height:58px;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.set.two span{font-size:25px;display:inline-flex;align-items:center;gap:8px}
.set.two b{font-size:12px;letter-spacing:.14em}
.set.two .sel span{color:var(--amber);font-weight:600}
.bpulse{position:absolute;inset:8px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--ice);pointer-events:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.75}}
/* large text (Settings › Text size): one step up the scale, and dim words get brighter */
.screen.big{--dim:rgba(255,240,200,.8);--faint:rgba(255,240,200,.6)}
.screen.big .card:not([data-v="voice"]) .t1{font-size:38px!important}.screen.big .card:not([data-v="voice"]) .t2{font-size:30px!important}.screen.big .card:not([data-v="voice"]) .t3{font-size:25px!important}
.screen.big .chip{font-size:27px}.screen.big .list .tx{font-size:27px!important}.screen.big .set span{font-size:28px}
.screen.big .rim text{font-size:17px}.screen.big .kk{font-size:31px}.screen.big .kf{font-size:31px}.screen.big .list .tm{font-size:18px}
/* ---------- panel ---------- */
.panel{display:flex;flex-direction:column;gap:30px;min-width:0}
.panel h1{font:500 40px/1 var(--display);margin:0;letter-spacing:-.01em}
.lede{margin:10px 0 0;color:var(--muted);max-width:52ch;text-wrap:pretty}
.panel h2{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 12px}
.say{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.say button{border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:var(--r-pill);padding:var(--s-2) 14px;cursor:pointer;text-align:left;font-size:var(--t-s);line-height:1.3;max-width:100%;
  transition:border-color var(--d-press),background var(--d-press),transform var(--d-press) var(--ease-out)}
.say button:hover,.sens button:hover,.seg button:hover{border-color:var(--ink)}
.say button:active,.sens button:active,.seg button:active,.btn-quiet:active{transform:scale(.97)}
.say button:focus-visible,.sens button:focus-visible,.seg button:focus-visible,.btn-quiet:focus-visible,.tourb:focus-visible,.lang button:focus-visible{outline:none;box-shadow:var(--focus)}
.say button.claude{border-color:var(--amber-ink);color:var(--amber-ink)}
.screens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.screens button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:22px 104px minmax(0,1fr);gap:10px;align-items:baseline;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.screens button:focus-visible{outline:2px solid var(--ink)}
.screens button:hover{background:var(--surface)}
.screens .n{font:400 11px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.screens .nm{font:500 16px/1.2 var(--display)}
.screens .ds{font-size:14px;color:var(--muted);line-height:1.35}
.screens button[aria-current="true"]{background:var(--surface)}
.screens button[aria-current="true"] .nm{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.ctrl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
.ctrl dt{font-weight:600}
.ctrl dd{margin:0;color:var(--muted)}
.sens{display:flex;flex-wrap:wrap;gap:8px}
.sens button{border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:var(--r-m);padding:var(--s-2) var(--s-3);cursor:pointer;font-size:var(--t-s);transition:border-color var(--d-press),transform var(--d-press) var(--ease-out)}
.sens button:hover{border-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:var(--r-pill);padding:7px 13px;cursor:pointer;font-size:var(--t-s);display:inline-flex;align-items:center;gap:6px;
  transition:border-color var(--d-press),background var(--d-state),color var(--d-state),transform var(--d-press) var(--ease-out)}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-ink);border-color:var(--on)}
.seg .live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}
/* the brain: a status line with one state colour, then the key fields (only for the key modes) */
.aistat{margin:var(--s-3) 0 0;padding-left:var(--s-3);border-left:2px solid var(--line);font-size:var(--t-s);color:var(--ink);max-width:52ch;text-wrap:pretty}
.aistat[data-state="ok"]{border-color:var(--ok)}.aistat[data-state="warn"]{border-color:var(--accent)}.aistat[data-state="wait"]{border-color:var(--line);color:var(--muted)}
.keys2{display:flex;flex-direction:column;gap:var(--s-3);margin-top:var(--s-4);max-width:440px}
.kfield{display:flex;flex-direction:column;gap:6px;font:500 var(--t-xs)/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kfield input{font:400 var(--t-s)/1.2 var(--mono);letter-spacing:0;text-transform:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;min-width:0;width:100%;
  transition:border-color var(--d-press),box-shadow var(--d-press)}
.kfield input:hover{border-color:var(--muted)}
.kfield input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.kfield input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 16%,transparent)}
.krow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s-2) var(--s-4)}
.kchk{display:inline-flex;align-items:center;gap:var(--s-2);font-size:var(--t-s);cursor:pointer}
.kchk input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.kerr{font:400 var(--t-xs)/1.3 var(--body);letter-spacing:0;text-transform:none;color:var(--danger);min-height:0}
.kerr:empty{display:none}
.btn-quiet{border:0;background:none;color:var(--muted);font-size:var(--t-s);padding:6px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;border-radius:var(--r-s)}
.btn-quiet:hover{color:var(--ink)}.btn-quiet:disabled{opacity:.45;cursor:default;text-decoration:none}
.hint{margin:10px 0 0;font-size:13px;color:var(--muted);max-width:52ch}
.say button.type{border-style:dashed}
.foot{font-size:13px;color:var(--muted);margin:0;max-width:52ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:#000;box-shadow:inset 0 0 0 3px var(--c)}
/* ================= SoulOS 3 · motion + system layers ================= */
/* touch: the word dips a little and the eyes glance at the finger; a small mark marks where you touched */
[data-act]{transition:scale .2s var(--spring),opacity .12s ease}
.prs{scale:.94;opacity:.78}
#fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden;border-radius:50%}
.rip{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--cream);box-shadow:0 0 12px rgba(255,240,200,.7);animation:rip .5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{from{transform:scale(1);opacity:.55}to{transform:scale(.2);opacity:0}}
#dimmer{position:absolute;inset:0;background:#000;pointer-events:none;z-index:12;opacity:0;border-radius:50%}
.coach{animation:fin .25s .4s ease both}

/* launcher: the Orbit. App names ride the lower rim like a smile; the eyes look at the word in the middle */
.orb{position:absolute;inset:0}
.orb>svg{position:absolute;inset:0;width:466px;height:466px;overflow:visible}
.orb .ow{cursor:pointer}
.orb .ow .m{font:400 15px/1 var(--r);letter-spacing:.16em;text-transform:uppercase;fill:var(--cream)}
.orb .ow .d{font:560 31px/1 var(--v);fill:var(--cream)}
.orb .hitw{fill:none;stroke:transparent;stroke-width:52;pointer-events:stroke}
.opv{position:absolute;left:78px;right:78px;top:252px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;color:var(--cream)}
.opv b{font:500 44px/1 var(--v);letter-spacing:-.02em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.opv small{font:400 14px/1 var(--r);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.opv .row1{display:flex;align-items:center;gap:14px;max-width:100%}
.opv.flip{animation:fin .2s cubic-bezier(.3,1.3,.5,1) both}
.otick{position:absolute;left:231px;top:446px;width:4px;height:12px;border-radius:2px;background:var(--cream);box-shadow:0 0 8px rgba(255,240,200,.7)}

/* Today: things it wants to tell you, one at a time, like a teleprompter under the eyes */
.wg{position:absolute;left:68px;top:0;width:330px;height:164px;padding:14px 16px;will-change:transform,opacity;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.wg-h{display:flex;justify-content:center;align-items:center;gap:12px;font:400 14px/1 var(--r);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.wg-h small{font:inherit;letter-spacing:.08em;text-transform:none;color:var(--faint)}
.wg-row{display:flex;align-items:center;justify-content:center;gap:16px;min-width:0;max-width:100%}
.wg-big{font:500 58px/1 var(--v);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.wg-sub{font:420 21px/1.2 var(--v);color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.wg-t{font:520 26px/1.15 var(--v);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wg.amber .wg-h{color:var(--amber)}
.wg .pdot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.tdots{position:absolute;inset:0;pointer-events:none}
.tdots i{position:absolute;width:5px;height:14px;margin-top:-4px;border-radius:3px;background:rgba(255,240,200,.2);transition:background .25s,transform .3s var(--spring)}
.tdots i.on{background:var(--cream);box-shadow:0 0 8px rgba(255,240,200,.6)}

/* Control: no sheet. The rim becomes two dials (light on the left, volume on the right); four glyph-words in the middle */
#cc{position:absolute;inset:0;border-radius:50%;z-index:6;pointer-events:none;opacity:0;transform:translate3d(0,-466px,0);will-change:transform,opacity}
#cc svg.rim{pointer-events:none}
#cc .arcw{fill:none;stroke-linecap:round;stroke-width:8}
#cc .knob{filter:drop-shadow(0 0 6px rgba(255,240,200,.7))}
.ccv{position:absolute;top:130px;font:400 13px/1 var(--r);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums}
.ccv b{display:block;margin-top:6px;font:500 30px/1 var(--v);letter-spacing:-.02em;text-transform:none;color:var(--cream)}
.ccv.vol b{color:var(--ice)}
.cct{position:absolute;top:156px;left:113px;width:240px;display:grid;grid-template-columns:1fr 1fr;gap:4px 0}
.ccb{height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;cursor:pointer;color:rgba(255,240,200,.42);font:420 21px/1 var(--v);
  transition:scale .34s var(--spring),color .25s}
.ccb svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ccb.on{color:var(--mint);font-weight:600}
.ccb.on.ice{color:var(--ice)}
.ccb.warn{color:var(--amber);font-weight:600}
.ccst{position:absolute;top:360px;left:90px;right:90px;text-align:center;font:400 12px/1 var(--r);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* status ring on the rim: battery (left), Claude (right); listening is the full ice ring drawn by the face */
#sring{position:absolute;inset:0;width:466px;height:466px;pointer-events:none;z-index:2;transition:opacity .2s ease}
#sring path{fill:none;stroke-linecap:round}
/* always-on clock while asleep */
#aod{position:absolute;left:0;right:0;top:318px;text-align:center;pointer-events:none;opacity:0;transition:opacity 1s ease;z-index:2}
#aod.on{opacity:1}
#aod b{display:block;font:500 60px/1 var(--v);color:rgba(255,240,200,.36);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#aod small{display:block;margin-top:12px;font:400 13px/1 var(--r);color:rgba(255,240,200,.26);letter-spacing:.18em;text-transform:uppercase}
/* charging */
#chg{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .22s ease;z-index:4}
#chg.on{opacity:1}
#chg .chg-arc{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px rgba(201,242,228,.8))}
.chg-c{position:absolute;left:0;right:0;top:290px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--mint)}
.chg-c b{display:flex;align-items:center;gap:8px;font:500 60px/1 var(--v);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chg-c b svg{width:34px;height:34px;fill:none;stroke:var(--mint);stroke-width:2;stroke-linejoin:round}
.chg-c small{font:400 13px/1 var(--r);letter-spacing:.18em;text-transform:uppercase;color:rgba(201,242,228,.7)}
/* the tour's finger */
#finger{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:50%;pointer-events:none;z-index:11;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.4),rgba(255,255,255,.14) 60%,rgba(255,255,255,0) 72%);border:2px solid rgba(255,255,255,.55);

   listening → "listening" · thinking → "thinking" · Claude at work → "working" (reading scan) · Claude needs you → "shocked", then
   wide eyes looking at you · done → "approve" · error → "confused" · notification → a glance to the rim where it arrives.

  }

    case "sw-lap": { const W = S.tm.sw; if (W.run) { W.laps.push(swNow()); soul.react("happy", 0.5); } else { W.acc = 0; W.laps = []; } refresh(); break; }
    case "cd-go": { const C = S.tm.cd; if (C.done) Object.assign(C, { left: C.total, done: false, run: true }); else C.run = !C.run; if (C.run) soul.lookAt(0, 0.8, 0.8); refresh(); break; }
    case "cd-reset": Object.assign(S.tm.cd, { run: false, left: S.tm.cd.total, done: false }); refresh(); break;
    case "cd-pre": { const m = +el.dataset.m; Object.assign(S.tm.cd, { total: m * 60, left: m * 60, run: true, done: false }); tmSec = -1; soul.react("happy", 0.8); refresh(); break; }
    case "soul-name": kbOpen({ ctx: "name", action: "save", initial: S.soul.name || "", onDone: t => nameSoul(t) }); break;
    case "soul-mood": {
      const m = S.soul.mood = (S.soul.mood + 1) % 5; soul.react(MOODR[m], 2.2);
      if (m === 1) { soul.lookAt(-0.8, -0.4, 0.5); after(550, () => soul.lookAt(0.8, -0.4, 0.5), "look"); }
      refresh(); break;
    }
    case "game-start": gameStart(); break;
    case "cc-dnd": S.dnd = !S.dnd; S.ccMsg = `${L.ccDnd} · ${S.dnd ? L.on : L.off}`; sfx(S.dnd ? "toggleOn" : "toggleOff"); hap("light"); soul.react(S.dnd ? "shy" : "wake", 1.2); ccRender(); break;
    case "cc-mic": S.micMute = !S.micMute; S.ccMsg = `${L.ccMic} · ${S.micMute ? L.off : L.on}`; sfx(S.micMute ? "toggleOff" : "toggleOn"); hap("light"); ccRender(); break;
    case "cc-snd": setSound(!AU.on); S.ccMsg = `${L.ccSnd} · ${AU.on ? L.on : L.off}`; hap("light"); ccRender(); break;
    case "cc-lock": sfx("tap"); ccClose(); after(260, () => goSleep(false), "lock"); break;
    case "cc-ai": { const o = ["none", "claude", "chatgpt", "api"]; setAi(o[(o.indexOf(S.ai) + 1) % o.length]); S.ccMsg = `AI · ${L.aiModes[S.ai]}`; ccRender(); break; }
  }
  if (S.view === "home" && /^cc-(dnd|mic)/.test(a) && curCard) curCard.innerHTML = cardHTML("home");
}

/* ================================================================ guided tour: plays the best moments by itself */
let TOUR = null;
const fingerEl = $("#finger");
function fingerAt(x, y) { fingerEl.style.transform = `translate3d(${(x - 26).toFixed(1)}px,${(y - 26).toFixed(1)}px,0)`; fingerEl.classList.add("show"); }
function fingerHide() { fingerEl.classList.remove("show", "down"); }
function tourCap(i) { const L = T(); $("#tourCap").innerHTML = i == null ? "" : `<small>${i + 1} / ${L.tour.length}</small>${esc(L.tour[i])}`; }
function tourStop() { if (TOUR) TOUR.stop = true; }
function updTourBtn() { const b = $("#tourBtn"); if (!b) return; b.textContent = TOUR ? T().tourStopB : T().tourBtn; b.classList.toggle("live", !!TOUR); }
async function tourRun() {
  if (TOUR) { tourStop(); return; }
  const tok = TOUR = { stop: false }; updTourBtn();
  const stopErr = () => Object.assign(new Error("tour stopped"), { tourStop: true });
  const W = ms => new Promise((res, rej) => { const t0 = performance.now(), f = () => { if (tok.stop) rej(stopErr()); else if (performance.now() - t0 >= ms) res(); else setTimeout(f, Math.min(40, ms)); }; setTimeout(f, Math.min(40, ms)); });
  const tw = (ms, fn) => new Promise((res, rej) => { const t0 = performance.now(); const st = now => { if (tok.stop) { rej(stopErr()); return; } const t = RM ? 1 : Math.min(1, (now - t0) / ms); fn(ease(t), t); if (t < 1) requestAnimationFrame(st); else res(); }; requestAnimationFrame(st); });
  const down = d => fingerEl.classList.toggle("down", d);
  const tapAt = async (x, y) => { fingerAt(x, y); await W(300); down(true); ripple({ x, y }); await W(130); down(false); };
  const cap = i => { if (tok.stop) throw stopErr(); tourCap(i); };
  try {
    cancel("msg"); cancel("claude");
    if (S.kb) kbBack(true); if (S.sleeping) wake(); if (S.cc) ccClose(true); hidePill();
    if (S.view === "voice") { S.voice = null; cancel("voice"); cancel("answer"); }
    S.claude.pending = null; soul.prog = 0; if (S.batt.chg) plug(false); hidePill();
    if (S.view !== "home") go("home", "fade"); await W(700);
    cap(0); await tapAt(233, 250); soul.react("boop"); sfx("boop"); await W(1500);
    await tapAt(233, 250); await W(60); down(true); await W(90); down(false); soul.react("laugh"); sfx("laugh"); await W(1500);
    cap(1); fingerAt(120, 240); await W(300); down(true);
    await tw(520, e => { const dx = 180 * e; fingerAt(120 + dx, 240); soul.layDirect = true; soul.lay = { k: 1 - Math.min(0.2, rubber(dx, 110) / 466 * 0.45), cy: 0, cx: rubber(dx, 110) / 466 }; });
    down(false); soul.layDirect = false; go("apps", "none"); fingerHide(); await W(1400);
    cap(2); fingerAt(330, 392); await W(300); down(true); lnGrab();
    await tw(900, e => { const dx = -190 * e; lnDrag(dx); fingerAt(330 + dx, 392 + 20 * Math.sin(e * Math.PI)); });
    lnRelease(-420); down(false); fingerHide(); await W(1600);
    fingerAt(130, 392); await W(250); down(true); lnGrab();
    await tw(700, e => { const dx = 160 * e; lnDrag(dx); fingerAt(130 + dx, 392 + 20 * Math.sin(e * Math.PI)); });
    lnRelease(0); down(false); fingerHide(); await W(900); lnSpinTo("weather"); await W(1100);
    cap(3); { const el = lnIcon("weather"); const [x, y] = el._pos; await tapAt(x, y); openApp("weather", el); } fingerHide(); await W(1800);
    await tapAt(233, 350); act("wx-next"); await W(1500); await tapAt(233, 350); act("wx-next"); fingerHide(); await W(1600);
    cap(4); sideEl.classList.add("down"); await W(180); sideEl.classList.remove("down"); sideButton(); await W(1300);
    cap(5); fingerAt(233, 380); await W(300); down(true);
    await tw(420, e => { fingerAt(233, 380 - 190 * e); soul.layDirect = true; soul.lay = { k: 1, cy: -rubber(190 * e, 110) / 466, cx: 0 }; });
    down(false); soul.layDirect = false; go("today", "up"); fingerHide(); await W(1300);
    for (let i = 1; i <= 4; i++) {
      fingerAt(233, 320); await W(200); down(true); stackGrab();
      await tw(360, e => { fingerAt(233, 320 - 140 * e); stackDrag(-140 * e); });
      down(false); stackRelease(-140, -320); await W(850);
    }
    fingerHide(); stackGo(0); await W(1000); go("home", "down"); await W(900);
    cap(6); fingerAt(233, 36); await W(300); down(true); ccPrep();
    await tw(620, e => { fingerAt(233, 36 + 300 * e); ccDrag(-466 + 300 * e * 1.45); });
    down(false); ccOpen(); fingerHide(); await W(900);
    { const at = a => [233 + 214 * Math.cos(a * Math.PI / 180), 233 + 214 * Math.sin(a * Math.PI / 180)], [b0, b1] = CCA.b;
      const a0 = b0 + (b1 - b0) * (S.bright - 0.15) / 0.85, setA = a => { const v = clamp((a - b0) / (b1 - b0), 0, 1); setBright(0.15 + 0.85 * v); ccSetArc("bright", v); fingerAt(...at(a)); soul.lookAt(-0.9, clamp((at(a)[1] - 233) / 200, -1, 1), 0.3); };
      fingerAt(...at(a0)); await W(300); down(true);
      await tw(800, e => setA(a0 + (150 - a0) * e));
      await tw(700, e => setA(150 + (b1 - 150) * e));
      down(false); }
    await tapAt(173, 217); act("cc-dnd"); await W(1300); await tapAt(173, 217); act("cc-dnd"); await W(800);
    fingerAt(233, 420); await W(250); down(true);
    await tw(450, e => { fingerAt(233, 420 - 250 * e); ccDrag(-250 * e * 1.25); });
    down(false); ccClose(); fingerHide(); await W(900);
    cap(7); { const nf = T().nfake; showPill({ who: nf[1][0], text: nf[1][1], dur: 4800, incoming: true }); buzz(); await W(1500); showPill({ who: nf[2][0], text: nf[2][1], dur: 4200, incoming: true }); await W(1500); claudeArrive(); await W(2300); }
    cap(8); hidePill(); go("claude", "up"); await W(1100); fingerAt(233, 300); await W(300); down(true); hold = { kind: "approve", p: 0 }; soul.progCol = PAL.mint;
    await W(1450); down(false); fingerHide(); await W(1700);
    cap(9); go("games", "zoom", { origin: [233, 233] }); await W(1100); await tapAt(233, 300); gameStart(); fingerHide();
    { const tEnd = performance.now() + 7000;
      while (performance.now() < tEnd && S.game.run) {
        await W(110); const G = S.game, st = G.stars.find(s => G.t - s.born > 0.3);
        if (st) { fingerAt(st.x, st.y); await W(170); down(true); if (G.stars.includes(st)) gameCatch(st); await W(110); down(false); }
      }
      if (S.game.run) S.game.left = 0.001; }
    fingerHide(); await W(2200);
    cap(10); go("home", "down"); await W(800); plug(true); await W(3900);
    cap(11); goSleep(false); await W(3600);
    cap(12); await tapAt(233, 233); wake(); fingerHide(); await W(2400);
    cap(13); S.batt.chg = false; syncPanel(); await W(3000);
  } catch (e) { if (!e || !e.tourStop) throw e; }
  finally {
    if (TOUR === tok) TOUR = null;
    fingerHide(); tourCap(null); soul.layDirect = false;
    if (hold && hold.kind === "approve") { hold = null; soul.prog = 0; }
    LN.drag = null; TD.drag = null; if (!S.cc) ccClose(true);
    applyFaceState(); updTourBtn(); bumpIdle();
  }
}
function updSndBtn() { const b = $("#sndBtn"); if (b) b.textContent = T().snd(AU.on); }
function updSysBtns() {
  const L = T(), c = $("#sys-charge"), s = $("#sys-sleep");
  if (c) c.textContent = L.sys.charge(S.batt.chg); if (s) s.textContent = L.sys.sleep(S.sleeping);
}

/* ---------------------------------------------------------------- sizing + loop */
const glassEl = $("#glass");
const DPR = Math.min(2, window.devicePixelRatio || 1);
function size() {
  const w = glassEl.clientWidth; if (!w) return;
  const k = w / 466; screen.style.transform = `scale(${k})`;
  const px = Math.round(w * DPR);
  if (px !== soul.S) { soul.cv.width = px; soul.cv.height = px; soul.S = px; soul.draw(); }
}
if ("ResizeObserver" in window) new ResizeObserver(size).observe(glassEl);
window.addEventListener("resize", size);

let last = performance.now(), lastSec = -1;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
  // hold-to-approve / hold-to-wipe progress
  if (hold && (hold.kind === "approve" || hold.kind === "wipe")) {
    hold.p = Math.min(1, hold.p + dt / 1.2); soul.prog = hold.p;
    if (hold.p >= 1) {
      const k = hold.kind; hold = null; soul.prog = 0;
      if (k === "approve") claudeDecide(true);
      else { S.memWiped = true; addDiary("wipe"); soul.react("wake"); showPill({ kind: "mint", text: T().memDone, dur: 1800 }); refresh(); }
    }
  }
  // focus timer
  const F = S.focus;
  if (F.run) {
    F.left -= dt;
    if (F.left <= 0) { F.left = 0; F.run = false; F.done = true; soul.react("star", 2.6); showPill({ kind: "mint", text: T().focusPill, dur: 2600 }); buzz(); if (S.view === "focus") refresh(); }
    const sec = Math.ceil(F.left);
    if (sec !== lastSec && curCard) {
      lastSec = sec;
      const d = curCard.querySelector('[data-live="fdig"]'); if (d) d.textContent = mmss(F.left);
      const hf = curCard.querySelector('[data-live="homefocus"]'); if (hf) hf.textContent = T().homeFocus(mmss(F.left));
      const r = curCard.querySelector('[data-live="fring"]'); if (r) { const C = 2 * Math.PI * 222; r.setAttribute("stroke-dashoffset", C * (1 - F.left / F.total)); }
    }
  }
  stepAnims(dt);
  launcherFrame(dt); stackFrame(dt); timerFrame(dt); gameFrame(dt); musicFrame(dt); battFrame(dt); statusFrame(ts / 1000);
  // asleep: the screen dims and the eyes breathe; awake: brightness ramps back up
  const dimT = S.sleeping && !S.chgShow ? 0.5 + (RM ? 0 : 0.1 * Math.sin(ts / 1000 * TAU / 5.5)) : 1;
  soul.dim = approach(soul.dim, dimT, S.sleeping ? 2.5 : 4, dt);
  if (!S.sleeping && performance.now() - S.lastAct > 45000 && idleOK()) goSleep(false);
  soul.update(dt); soul.draw();
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- boot */
initData();
$("#icdefs").innerHTML = rimDefs(); setSt(ccEl, { y: -466, o: 0, s: 1 }); setBright(S.bright);
if (matchMedia("(max-width: 920px)").matches) document.querySelectorAll("details.fold").forEach(d => { d.open = false; });
renderPanel();
size();
try { if (localStorage.getItem("soulos-big") === "1") setBig(true); } catch (e) {}
/* first boot (or ?boot / #boot): the birth sequence; otherwise straight to the face */
if (!BORN || /(^|[?&#])boot\b/.test(location.search + location.hash)) bootStart();
else { go("home", "fade"); soul.react("intro"); demoTimers(); }
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (curCard && S.view === "apps") { curCard._w = null; curCard._lkey = null; } });
setInterval(() => { const c = curCard && curCard.querySelector('[data-live="clock"]'); if (c) c.textContent = hhmm(); if (S.sleeping) updateAod(); }, 10000);
setInterval(checkAlarms, 1000);
window.__soul = { S, go, kbOpen, kbRender, setAi, ringAlarm, parseTime, candidates, cancel,
  LN, TD, ORB, setBright, openApp, lnIcon, lnSpinTo, CCA, ccOpen, ccClose, plug, goSleep, wake, gameStart, gameCatch, tourRun, tourStop, showPill, stackGo, act, setSound, AU, ANIMS, get TOUR() { return TOUR; },
  soul, BOOT, BIRTH, BRAIN, bootStart, bootDone, parseReply, validAction, sayPartial, aiAsk, setKey, claudeArrive, rebirth, setBig, brainRules };   /* test hook (Playwright) */
</script>
