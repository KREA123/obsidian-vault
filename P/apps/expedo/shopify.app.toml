# Shopify app config (Dev Dashboard / Shopify CLI): `shopify app deploy` pushes it to the app.
client_id = "f8ed5b7064a0b5d373c6bae33dd1f6b5"
name = "Expedo"
# Handle: part of the plan selection page URL (SHOPIFY_APP_HANDLE must match).
handle = "expedo"
application_url = "https://expedo.onrender.com/"
embedded = true

[access_scopes]
scopes = "read_orders,write_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

[auth]
redirect_urls = ["https://expedo.onrender.com/auth/callback"]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/updated", "orders/cancelled", "app/uninstalled", "app_subscriptions/update"]
  uri = "/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/shopify"
