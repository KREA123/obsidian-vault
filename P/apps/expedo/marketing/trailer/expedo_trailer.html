<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Expedo Trailer</title>
<!--
  EXPEDO — motion-design trailer (Shopify app for Romanian online shops, ARTEMIS DIGITAL SRL).
  Deterministic: every frame is a pure function of time t (seconds). No wall clock, no unseeded randomness.
  render(t) draws one frame; window.READY / window.T_END for the recorder (render.py, Playwright + ffmpeg).
  Params: ?lang=ro|en   ?layout=h|v  (h = 1920x1080, v = 1080x1920)   ?play=1 real-time preview   ?t=12.5 one frame
  Timeline: written on the music's beat grid (120 BPM, 1 beat = 0.5 s, b(n) = n * 0.5 s). audio.py uses the same grid.
  UI: real screenshots of the app (ui/*.png, 2x) captured by capture.py; element boxes in ui/manifest.js.
-->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0b0d12;overflow:hidden}
#stage{position:relative;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#16191f;background:#f5f6f8}
.a{position:absolute;left:0;top:0}
.root{position:absolute;left:0;top:0;overflow:hidden;transform-origin:50% 50%}
.full{position:absolute;left:0;top:0;width:100%;height:100%}
.h{font-family:Archivo,sans-serif;font-weight:800;font-stretch:112%;letter-spacing:-.025em;line-height:1.02;white-space:nowrap}
.k{font-family:Inter;font-weight:700;text-transform:uppercase;letter-spacing:.16em;white-space:nowrap}
.ln{display:block}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .12em;margin-bottom:-.12em}
.wi{display:inline-block;will-change:transform}
.uif{position:absolute;left:0;top:0;overflow:hidden;background:#f5f6f8;border-radius:22px;
  box-shadow:0 60px 120px rgba(13,31,92,.26),0 18px 36px rgba(13,31,92,.12),0 0 0 1px rgba(22,25,31,.08)}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.lay{position:absolute;left:0;top:0;display:block}
.crop{position:absolute;left:0;top:0;background-repeat:no-repeat}
.ring{position:absolute;left:0;top:0;border:3px solid #1f4bd8;border-radius:10px;box-shadow:0 0 0 6px rgba(31,75,216,.16)}
.mark{position:absolute;left:0;top:0;background:rgba(245,197,24,.5);mix-blend-mode:multiply;border-radius:3px;transform-origin:0 50%}
.cursor{position:absolute;left:0;top:0;width:34px;height:34px;opacity:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.28));transform-origin:6px 4px}
.rip{position:absolute;left:0;top:0;border-radius:50%;border:3px solid #1f4bd8;opacity:0}
.card{position:absolute;left:0;top:0;background:#fff;border-radius:20px;box-shadow:0 30px 70px rgba(13,31,92,.16),0 0 0 1px rgba(22,25,31,.06)}
.chip{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:.5em;white-space:nowrap;background:#fff;border-radius:999px;
  font-weight:600;box-shadow:0 10px 24px rgba(13,31,92,.10),0 0 0 1px rgba(22,25,31,.08)}
.err{position:absolute;left:0;top:0;border-radius:16px;background:linear-gradient(180deg,#232937,#1b202b);color:#fff;
  box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.07);display:flex;gap:18px;align-items:flex-start;overflow:hidden}
.err .bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:#ef4444}
.err .ic{flex:none;border-radius:50%;background:rgba(239,68,68,.16);display:flex;align-items:center;justify-content:center}
.err .t{font-weight:700;white-space:nowrap}
.err .d{font-family:'JetBrains Mono',monospace;color:#8f98a8;white-space:nowrap;margin-top:6px}
.gloss{position:absolute;left:0;top:0;background:#16191f;color:#fff;border-radius:12px;font-weight:600;white-space:nowrap;
  box-shadow:0 14px 30px rgba(0,0,0,.25)}
.gloss b{color:#f5c518;font-weight:700;margin-right:.45em}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes" class="full"></div>
  <div id="fx" class="full" style="pointer-events:none"></div>
</div>
<script src="ui/manifest.js"></script>
<script>
'use strict';
/* ───────────────────────── params / layout ───────────────────────── */
const Q = new URLSearchParams(location.search);
const V = Q.get('layout') === 'v' || Q.get('v') === '1';
const LANG = Q.get('lang') === 'en' ? 'en' : 'ro';
const EN = LANG === 'en';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const pick = (h, v) => V ? v : h;
const BEAT = 0.5, b = n => n * BEAT;          // 120 BPM grid
const T_END = 56;
const M = window.UI_MANIFEST;
document.documentElement.lang = LANG;

/* ───────────────────────── palette ───────────────────────── */
const C = { cobalt:'#1f4bd8', cobaltD:'#14348f', cobaltX:'#0d1f5c', yellow:'#f5c518', ink:'#16191f', paper:'#f5f6f8',
  red:'#ef4444', green:'#0f7a4a', muted:'#5f6775' };

/* ───────────────────────── copy (RO / EN). A value may be {h, v} for layout-specific line breaks ───────────────────────── */
const TX = {
 ro: {

  painH: {h:'Și nimeni nu-ți spune\nce să repari.', v:'Și nimeni\nnu-ți spune\nce să repari.'},
  tag: {h:'Comenzile Shopify, procesate automat.', v:'Comenzile Shopify,\nprocesate automat.'},
  flowK: 'Totul, automat', flowH: {h:'De la comandă la ramburs. Automat.', v:'De la comandă\nla ramburs.\nAutomat.'},
  nodes: ['Adresa\nverificată','AWB\ngenerat','Factura\nemisă','Expediată\nîn Shopify','Coletul\nurmărit','Ramburs\nîncasat'],
  couriersK: 'Curieri', invK: 'Facturare',
  s4k: 'Verificare adresă', s4h: {h:'Adresa, verificată\nînainte de curier.', v:'Adresa, verificată\nînainte de curier.'},
  s4chips: ['Județ','Localitate','Sector','Telefon','Cod poștal'], s4h2: {h:'Ai greșit?\nCorectezi pe loc.', v:'Ai greșit?\nCorectezi pe loc.'},
  s5h: {h:'Fiecare eroare, pe românește.', v:'Fiecare eroare,\npe românește.'}, s5s: 'Și ce ai de făcut.',
  s6h: 'Selectezi tot. Un clic.', s6h2: {h:'AWB-uri, facturi, etichete. Un singur PDF.', v:'AWB-uri, facturi, etichete.\nUn singur PDF.'}, pdfTag: n => `1 PDF · ${n} etichete`,
  s7k: 'Reguli', s7h: {h:'Reguli pentru\nfiecare caz.', v:'Reguli pentru\nfiecare caz.'}, s7h2: {h:'Mod de probă,\npe comenzi reale.', v:'Mod de probă,\npe comenzi reale.'},
  s8a: 'Fără AWB-uri sau facturi duble', s8b: 'Reîncearcă singur când un curier nu răspunde', s8k: 'Clienți care au refuzat colete',
  s9k: 'Urmărire colete', s9h: {h:'Urmărit până\nla livrare.', v:'Urmărit până la livrare.'}, s9h2: {h:'Ramburs încasat,\nbifat automat.', v:'Ramburs încasat,\nbifat automat.'},
  endTag: 'Comenzile pleacă singure.', endSub: 'Pentru magazinele Shopify din România', pub: 'ARTEMIS DIGITAL SRL',
  gl: null,
 },
 en: {
  errs: [['Label failed','Error 400: Invalid locality'], ['Invoice error','Signature mismatch: hash'], ['Duplicate label','Order #1042 already has an AWB'],
         ['Error 500','{"error":"Internal Server Error"}'], ['Invoice issued twice','#1038 · 2 invoices'], ['Courier not responding','ETIMEDOUT 30000ms'],
         ['Invalid field','county_id: null'], ['Order stuck','status: pending · 3 days'], ['Phone rejected','phone: "+40 7"'],
         ['Invoice out of sync','invoice_id: undefined']],
  painH: {h:'And nobody tells you\nwhat to fix.', v:'And nobody\ntells you\nwhat to fix.'},
  tag: {h:'Shopify orders, processed automatically.', v:'Shopify orders,\nprocessed automatically.'},
  flowK: 'All automatic', flowH: {h:'From order to cash. Automatically.', v:'From order\nto cash.\nAutomatically.'},
  nodes: ['Address\nchecked','Shipping label\n(AWB)','Invoice\nissued','Fulfilled\nin Shopify','Parcel\ntracked','Cash on delivery\ncollected'],
  couriersK: 'Couriers', invK: 'Invoicing',
  s4k: 'Address check', s4h: {h:'Addresses checked\nbefore the courier.', v:'Addresses checked\nbefore the courier.'},
  s4chips: ['County','Town','Sector','Phone','Postcode'], s4h2: {h:'A typo?\nFix it on the spot.', v:'A typo?\nFix it on the spot.'},
  s5h: {h:'Every error in plain words.', v:'Every error\nin plain words.'}, s5s: 'Plus what to do next.',
  s6h: 'Select all. One click.', s6h2: {h:'Labels and invoices. One PDF.', v:'Labels and invoices.\nOne PDF.'}, pdfTag: n => `1 PDF · ${n} labels`,
  s7k: 'Rules', s7h: {h:'Rules for\nevery case.', v:'Rules for\nevery case.'}, s7h2: {h:'Test mode,\non real orders.', v:'Test mode,\non real orders.'},
  s8a: 'No duplicate labels or invoices', s8b: 'Retries on its own when a courier is down', s8k: 'Customers who refused parcels before',
  s9k: 'Parcel tracking', s9h: {h:'Tracked all the way\nto the door.', v:'Tracked to the door.'}, s9h2: {h:'Cash on delivery,\nmarked as collected.', v:'Cash on delivery,\nmarked as collected.'},
  endTag: 'Orders that ship themselves.', endSub: 'Built for Shopify stores in Romania', pub: 'ARTEMIS DIGITAL SRL',
  // English glosses for the Romanian UI (the app speaks Romanian; the EN cut translates the key lines)
  gl: { aivrut: 'Did you mean: Eforie Sud, Eforie Nord, Corbu?', iss: ['Missing county. Pick it from the list.',
        'Missing phone. Couriers refuse labels without one.', 'Town not in the Cargus list. Did you mean …?'],
        refused: 'The customer refused 2 parcels before. Call first, or ask for card payment.', rules: ['easybox → Sameday', 'big COD orders → on hold'],
        test: 'Test mode: test labels and invoices, nothing is sent.' },
 },
};
const T = TX[LANG];
if (M.uiLang === LANG) T.gl = null;   // the UI already speaks the video's language: no glosses
const tx = v => (v && typeof v === 'object' && !Array.isArray(v)) ? (V ? v.v : v.h) : v;

/* ───────────────────────── math / easing ───────────────────────── */
const clamp = (x,a=0,b_=1) => Math.min(b_, Math.max(a, x));
const lerp = (a,b_,p) => a + (b_-a)*p;
const seg = (t,a,b_) => clamp((t-a)/(b_-a));
const eo = p => p>=1 ? 1 : 1 - Math.pow(2, -10*p);
const co = p => 1 - Math.pow(1-p, 3);
const ci = p => p*p*p;
const eio = p => p<.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2;
const sio = p => -(Math.cos(Math.PI*p) - 1)/2;
const bo = p => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };
const pulse = (t,a,b_) => seg(t,a,a+(b_-a)/2) - seg(t,a+(b_-a)/2,b_);
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
// keyframes: [[t, ...values]] → interpolated values (ease per segment), holds outside
function kf(t, keys, ease = eio){
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++){
    const [t1] = keys[i], [t0] = keys[i-1];
    if (t <= t1){ const p = ease(seg(t, t0, t1)); return keys[i].slice(1).map((v, j) => lerp(keys[i-1][j+1], v, p)); }
  }
  return keys[keys.length-1].slice(1);
}

/* number formatting copied from a UI string: '1.441,30 lei' / 'RON 1,441.30' → formatter + parser */
function parseNum(t){
  const m = /\d[\d.,\s\u00a0]*/.exec(t || ''); if (!m) return 0;
  let x = m[0].replace(/[\s\u00a0]/g, '').replace(/[.,]$/, '');
  if (/[.,]\d{2}$/.test(x)) x = x.slice(0, -3).replace(/[.,]/g, '') + '.' + x.slice(-2); else x = x.replace(/[.,]/g, '');
  return parseFloat(x) || 0;
}
function numFormat(t){
  const m = /\d[\d.,\s\u00a0]*\d/.exec(t || '0,00 lei') || ['0'];
  const num = m[0], pre = (t || '').slice(0, m.index || 0), post = (t || ' lei').slice((m.index || 0) + num.length);
  const dec = /[.,]\d{2}$/.test(num) ? num[num.length - 3] : null;
  const grp = (num.replace(dec ? num.slice(-3) : '', '').match(/[.,\s\u00a0]/) || [dec === ',' ? '.' : ','])[0];
  return v => { const [i, f] = Math.abs(v).toFixed(dec ? 2 : 0).split('.');
    return pre + i.replace(/\B(?=(\d{3})+(?!\d))/g, grp) + (dec ? dec + f : '') + post; };
}

/* ───────────────────────── DOM helpers ───────────────────────── */
function mk(tag, cls, parent, css, html){
  const e = document.createElement(tag); if (cls) e.className = cls;
  if (css) e.style.cssText = css; if (html != null) e.innerHTML = html;
  (parent || document.body).appendChild(e); return e;
}
function P(el, x, y, o = {}){
  const s = o.s ?? 1, sx = o.sx ?? s, sy = o.sy ?? s, r = o.r ?? 0, ax = o.ax ?? .5, ay = o.ay ?? .5;
  el.style.transformOrigin = `${ax*100}% ${ay*100}%`;
  el.style.transform = `translate(${x}px,${y}px) translate(${-ax*100}%,${-ay*100}%) rotate(${r}deg) scale(${sx},${sy})`;
  el.style.opacity = o.o ?? 1;
  const bl = o.b ?? 0; el.style.filter = bl > .15 ? `blur(${bl.toFixed(2)}px)` : (o.f || 'none');
  el.style.visibility = (o.o ?? 1) <= 0.001 ? 'hidden' : 'visible';
}
// headline with masked word reveal. text: '\n' = line break. returns {el, ws:[inner spans]}
function head(parent, text, css, cls = 'a h', maxW = null){
  const el = mk('div', cls, parent, css); const ws = [];
  el.dataset.maxw = maxW || (V ? 940 : 1680);   // fitted after fonts load (setup)
  text.split('\n').forEach(line => {
    const l = mk('span', 'ln', el);
    line.split(' ').forEach((w, i) => { if (i) l.appendChild(document.createTextNode(' '));
      const m = mk('span', 'wm', l); ws.push(mk('span', 'wi', m, null, w)); });
  });
  return { el, ws };
}
// p 0..1 reveal (word-staggered by the caller), negative-going handled by caller
function wv(span, p){ span.style.transform = `translateY(${((1 - eo(clamp(p)))*112).toFixed(1)}%)`; }
function reveal(hd, lt, t0, step = .07, dur = .5, out = null){
  hd.ws.forEach((w, i) => {
    const pin = seg(lt, t0 + i*step, t0 + i*step + dur);
    let y = (1 - eo(pin))*112;
    if (out != null){ const po = seg(lt, out + i*.03, out + i*.03 + .28); y -= ci(po)*112; }
    w.style.transform = `translateY(${y.toFixed(1)}%)`;
  });
}
// shrink font size until the element fits maxW (call after fonts load)
function fitW(el, maxW){ let fs = parseFloat(el.style.fontSize); while (el.offsetWidth > maxW && fs > 10){ fs -= 1; el.style.fontSize = fs + 'px'; } return fs; }

/* ───────────────────────── icons (24 grid, stroke) ───────────────────────── */
const IC = {
  pin:'<path d="M12 21s-7-6.2-7-11.2a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.6"/>',
  awb:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9v6M10 9v6M12.5 9v6M15 9v6M17 9v6"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  truck:'<path d="M1 4h14v12H1zM15 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/><path d="M6 12h.01M18 12h.01"/>',
  shield:'<path d="M12 3 4 6v6c0 4.6 3.4 8.3 8 9 4.6-.7 8-4.4 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  retry:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  alert:'<path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
};
const svgI = (name, size, color, sw = 2) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[name]}</svg>`;
// the Expedo mark: isometric box line-icon in a rounded square (from public/index.html), drawable
function markSvg(size, bg, fg){
  return `<svg viewBox="0 0 32 32" width="${size}" height="${size}"><rect class="sq" width="32" height="32" rx="8" fill="${bg}"/>
    <path class="p1" pathLength="1" d="M8 11l8-4 8 4v10l-8 4-8-4z" fill="none" stroke="${fg}" stroke-width="2.2" stroke-linejoin="round"/>
    <path class="p2" pathLength="1" d="M8 11l8 4 8-4" fill="none" stroke="${fg}" stroke-width="2.2" stroke-linejoin="round"/>
    <path class="p3" pathLength="1" d="M16 15v10" fill="none" stroke="${fg}" stroke-width="2.2"/></svg>`;
}
function setMarkDraw(el, p){ // p 0..1 stroke draw
  const q = [[el.querySelector('.p1'), 0, .6], [el.querySelector('.p2'), .35, .8], [el.querySelector('.p3'), .55, 1]];
  for (const [pa, a, z] of q){ const d = 1 - eo(seg(p, a, z)); pa.style.strokeDasharray = '1 1'; pa.style.strokeDashoffset = d.toFixed(4); }
}
const CURSOR = `<svg viewBox="0 0 34 34" width="34" height="34"><path d="M6 4l20 11.5-8.6 1.9L13 25.6z" fill="#fff" stroke="#16191f" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* ───────────────────────── UI frame (real screenshots + camera) ───────────────────────── */
const RC = (shot, name) => { const r = M[shot].rects[name]; return { x:r[0], y:r[1], w:r[2], h:r[3], cx:r[0]+r[2]/2, cy:r[1]+r[3]/2 }; };
const U = (...rs) => { const x0 = Math.min(...rs.map(r => r.x)), y0 = Math.min(...rs.map(r => r.y)), x1 = Math.max(...rs.map(r => r.x + r.w)), y1 = Math.max(...rs.map(r => r.y + r.h));
  return { x:x0, y:y0, w:x1-x0, h:y1-y0, cx:(x0+x1)/2, cy:(y0+y1)/2 }; };
const R = (x, y, w, h) => ({ x, y, w, h, cx:x+w/2, cy:y+h/2 });
class Frame {
  constructor(parent, fw, fh, shots, css = ''){
    this.fw = fw; this.fh = fh; this.cx = 0; this.cy = 0; this.z = 1;
    this.el = mk('div', 'uif', parent, `width:${fw}px;height:${fh}px;${css}`);
    this.world = mk('div', 'world', this.el);
    this.L = {}; this.ww = M[shots[0]].w; this.wh = M[shots[0]].h;
    for (const s of shots){ const m = M[s]; const im = mk('img', 'lay', this.world, `width:${m.w}px;height:${m.h}px`); im.src = `ui/${s}.png`; this.L[s] = im; }
    this.over = mk('div', 'a', this.world);
    this.hud = mk('div', 'a', this.el, `width:${fw}px;height:${fh}px`);
    this.cur = mk('div', 'cursor', this.hud, null, CURSOR);
    this.rip = [0,1].map(() => mk('div', 'rip', this.hud));
  }
  fit(r, pad = 36, zmax = 3){ return [r.cx, r.cy, Math.min((this.fw - 2*pad)/r.w, (this.fh - 2*pad)/r.h, zmax)]; }
  cam(x, y, z){
    if (this.clampCam !== false){   // never show past the screenshot's top/left/right edges when it is larger than the view
      const ww = this.ww, wh = this.wh, hw = this.fw/(2*z), hh = this.fh/(2*z);
      if (ww > 2*hw) x = clamp(x, hw, ww - hw); else x = ww/2 > x ? Math.max(x, Math.min(ww/2, hw)) : x;
      if (wh > 2*hh) y = clamp(y, hh, wh - hh);
    }
    this.cx = x; this.cy = y; this.z = z;
    this.world.style.transform = `translate(${(this.fw/2 - x*z).toFixed(2)}px,${(this.fh/2 - y*z).toFixed(2)}px) scale(${z.toFixed(4)})`; }
  toF(x, y){ return [this.fw/2 + (x - this.cx)*this.z, this.fh/2 + (y - this.cy)*this.z]; }
  only(name, o = 1){ for (const k in this.L) this.L[k].style.opacity = k === name ? o : 0; }
  // cursor: path [[t, x, y]] in world coords, clicks [t...]
  cursor(lt, path, clicks = [], vis = [0, 99]){
    const on = lt >= vis[0] && lt < vis[1];
    const [x, y] = kf(lt, path, sio);
    const [fx, fy] = this.toF(x, y);
    let press = 0; for (const c of clicks) press = Math.max(press, pulse(lt, c - .06, c + .16));
    const o = on ? Math.min(seg(lt, vis[0], vis[0] + .2), 1 - seg(lt, vis[1] - .2, vis[1])) : 0;
    P(this.cur, fx, fy, { ax: 6/34, ay: 4/34, s: 1 - .16*press, o });
    this.rip.forEach((r, i) => {
      const c = clicks.filter(c => lt >= c).pop(); const p = c == null ? 1 : seg(lt, c + i*.08, c + .5 + i*.08);
      let rx = fx, ry = fy;
      if (c != null){ const [wx, wy] = kf(c, path, sio); [rx, ry] = this.toF(wx, wy); }

scene(b(80), b(88), root => {
  const s = {};
  s.bg = bgDiv(root, 'paper'); s.bl = blobs(root);
  const cw = pick(1420, 960);
  const feat = (icon, text) => {
    const e = mk('div', 'card', root, `width:${cw}px;display:flex;align-items:center;gap:30px;padding:${pick(30, 30)}px ${pick(36, 34)}px`);
    mk('div', null, e, `width:${pick(96, 90)}px;height:${pick(96, 90)}px;border-radius:22px;background:${C.cobalt};display:flex;align-items:center;justify-content:center;flex:none`, svgI(icon, 46, '#fff', 2));
    mk('div', null, e, `font-family:Archivo;font-weight:800;font-stretch:108%;letter-spacing:-.02em;font-size:${pick(50, 46)}px;line-height:1.08;color:${C.ink};${V ? 'white-space:normal' : 'white-space:nowrap'}`, text);
    return e;
  };
  s.c1 = feat('shield', T.s8a); s.c2 = feat('retry', T.s8b);
  s.c3 = mk('div', 'card', root, `width:${cw}px;padding:${pick(28, 28)}px ${pick(34, 32)}px`);
  const hd = mk('div', null, s.c3, `display:flex;align-items:center;gap:16px;margin-bottom:18px`);
  mk('div', null, hd, `width:52px;height:52px;border-radius:14px;background:#fff4dc;display:flex;align-items:center;justify-content:center`, svgI('user', 30, '#9a5b00', 2));
  mk('div', 'k', hd, `font-size:${pick(22, 22)}px;color:#9a5b00;letter-spacing:.12em`, T.s8k);
  const wr = R(0, 0, M.warn_refused.w, M.warn_refused.h), sc = (cw - pick(68, 64)) / wr.w;
  const wc = cropEl(s.c3, 'warn_refused', wr, sc, 'position:relative;border-radius:12px');
  if (T.gl) mk('div', null, s.c3, `margin-top:16px;font-size:24px;color:${C.muted};font-weight:500;white-space:normal`, `<b style="color:${C.cobalt}">EN</b> ${T.gl.refused}`);
  return s;
}, (lt, s, t) => {
  blobsSet(s.bl, t);
  const ex = ci(seg(lt, 3.92, 4));
  const ys = V ? [540, 840, 1270] : [250, 455, 770];
  [s.c1, s.c2, s.c3].forEach((c, i) => {
    const p = i ? seg(lt, [0, .9, 2.0][i], [0, .9, 2.0][i] + .45) : .35 + .65*seg(lt, 0, .45);
    P(c, W/2 + (1 - eo(p))*pick(0, 0), ys[i] + (1 - eo(p))*60 - lt*6, { o: clamp(p*2) * (1 - ex), s: lerp(.96, 1, eo(p)) * (1 - ex*.05), b: ex*6 });
  });
});

/* 9 ─ TRACKING → DELIVERED → RAMBURS COLLECTED (b88–b100, second drop) */
scene(b(88), b(100), root => {
  const s = {};
  s.bg = bgDiv(root, 'paper'); s.bl = blobs(root);
  s.FR = V ? { x:60, y:620, w:960, h:1180 } : { x:820, y:80, w:1000, h:920 };
  s.F = new Frame(root, s.FR.w, s.FR.h, ['dtrack']);
  s.cls = M.dtrack.li || [];                                  // timeline items, newest first (classes: success / info / …)
  s.lis = s.cls.map(() => mk('div', 'mark', s.F.over));
  s.ringLiv = mk('div', 'ring', s.F.over);
  s.FR2 = V ? { x:60, y:860, w:960, h:430 } : { x:820, y:280, w:1000, h:480 };
  s.F2 = new Frame(root, s.FR2.w, s.FR2.h, ['dash_after']);
  // live counter over the "COD collected (30 days)" stat (Inter 700 24px, tabular, like the app), formatted like the UI
  s.ci = M.codStat ?? 4;
  const v4 = RC('dash_after', 'val' + s.ci), s4 = RC('dash_after', 'sub' + s.ci);
  const tA = M.dash_after.texts, tB = M.dash_before.texts;
  s.fmt = numFormat(tA['val' + s.ci]); s.v0 = parseNum(tB['val' + s.ci]); s.v1 = parseNum(tA['val' + s.ci]);
  s.sub0 = tB['sub' + s.ci]; s.sub1 = tA['sub' + s.ci];
  s.cnt = mk('div', 'a', s.F2.over, `left:${v4.x - 1}px;top:${v4.y}px;width:${v4.w + 2}px;height:${v4.h}px;background:#fff;font:700 24px/36px Inter;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#16191f;white-space:nowrap`);
  s.sub = mk('div', 'a', s.F2.over, `left:${s4.x - 1}px;top:${s4.y}px;width:${s4.w + 2}px;height:${s4.h}px;background:#fff;font:400 12px/18px Inter;color:#8b93a1;white-space:nowrap`);
  s.ring4 = mk('div', 'ring', s.F2.over);
  s.flash = mk('div', 'full', root, 'background:#fff');
  s.k = kicker(root, T.s9k);
  s.h1 = head(root, tx(T.s9h), `font-size:${pick(76, 74)}px;color:${C.ink}`, 'a h', pick(660, 940));
  s.h2 = head(root, tx(T.s9h2), `font-size:${pick(76, 74)}px;color:${C.ink}`, 'a h', pick(660, 940));
  return s;
}, (lt, s, t) => {
  blobsSet(s.bl, t);
  const F = s.F, F2 = s.F2, FR = s.FR, ex = ci(seg(lt, 5.75, 6));
  s.flash.style.opacity = (1 - eo(seg(lt, 0, .3))) * .9; s.flash.style.zIndex = 30;
  const ein = eo(seg(lt, 0, .45));
  const sw = seg(lt, 2.95, 3.15);   // cut to the dashboard
  P(F.el, FR.x + FR.w/2, FR.y + FR.h/2 + (1 - ein)*60, { o: (1 - sw), s: lerp(1.04, 1, ein) });
  P(F2.el, s.FR2.x + s.FR2.w/2, s.FR2.y + s.FR2.h/2, { o: sw * (1 - ex), s: lerp(1.04, 1, eo(seg(lt, 3.0, 3.4))) });
  // timeline: oldest (bottom) → newest (top)
  const tl = RC('dtrack', 'timeline');
  const hz = F.fit(R(tl.x - 10, tl.y, 560, tl.h), 24, 1.75);
  F.cam(...kf(lt, [[0, hz[0], hz[1] + 60, hz[2]], [2.9, hz[0], hz[1] - 50, hz[2]*1.04]], sio));
  const n = s.lis.length, stp = Math.min(.23, 2.3 / Math.max(1, n));
  const lr = i => { const t = M.dtrack.rects['lit' + i]; return t && t[0] ? R(t[0][0] - 4, t[0][1] - 2, t[0][2] + 8, t[0][3] + 4) : RC('dtrack', 'li' + i); };
  s.lis.forEach((m, k) => {                                    // oldest (bottom) → newest (top)
    const i = n - 1 - k, r = lr(i);
    const p = seg(lt, .25 + k*stp, .45 + k*stp);
    markSet(m, r, p, .85, s.cls[i] === 'success' && i < 3 ? 'rgba(15,122,74,.18)' : 'rgba(31,75,216,.10)');
  });
  const liv = Math.max(0, s.cls.findIndex(c => c !== 'success'));   // the newest status line = "Delivered"
  ringSet(s.ringLiv, F, lr(liv), seg(lt, 1.95, 2.25), 5, C.cobalt);
  s.ringLiv.style.display = lt > 1.95 ? '' : 'none';
  // dashboard: the counter rolls up to the real value
  const st = U(RC('dash_after', 'stat' + Math.max(0, s.ci - 1)), RC('dash_after', 'stat' + s.ci));
  const dz = F2.fit(st, 30, 2.4);
  F2.cam(...kf(lt, [[3.0, dz[0], dz[1] + 6, dz[2]*.94], [6, dz[0], dz[1], dz[2]*1.0]], sio));
  const cp = eio(seg(lt, 3.3, 4.6));
  s.cnt.textContent = s.fmt(lerp(s.v0, s.v1, cp));
  s.sub.textContent = cp < 1 ? s.sub0 : s.sub1;
  ringSet(s.ring4, F2, RC('dash_after', 'stat' + s.ci), seg(lt, 4.55, 4.85), 4, C.cobalt); s.ring4.style.display = lt > 4.55 ? '' : 'none';
  const tx0 = V ? 80 : 120;
  P(s.k, tx0, V ? 180 : 230, { ax: 0, o: eo(seg(lt, .1, .4)) * (1 - ex) });
  reveal(s.h1, lt, .15, .07, .5, 2.8); P(s.h1.el, tx0, V ? 240 : 290, { ax: 0, ay: 0, o: lt < 3.3 ? 1 - ex : 0 });
  reveal(s.h2, lt, 3.05, .07, .5); P(s.h2.el, tx0, V ? 240 : 290, { ax: 0, ay: 0, o: lt > 3.0 ? 1 - ex : 0 });
});

/* 10 ─ END CARD (b100–b112) */
scene(b(100), T_END + .1, root => {
  const s = {};
  s.bg = bgDiv(root, 'cobalt'); s.grid = isoGrid(root, .07);
  s.lock = logoLockup(root, pick(150, 170));
  s.tape = mk('div', 'a', root, `height:18px;background:${C.yellow};border-radius:3px`);
  s.tag = head(root, T.endTag, `font-size:${pick(92, 76)}px;color:#fff;font-weight:900;font-stretch:115%`);
  s.sub = mk('div', 'a', root, `font-size:${pick(34, 36)}px;font-weight:600;color:rgba(255,255,255,.88);white-space:nowrap`, T.endSub);
  s.pub = mk('div', 'a k', root, `font-size:${pick(18, 20)}px;color:rgba(255,255,255,.55);letter-spacing:.24em`, T.pub);
  s.fade = mk('div', 'full', root, `background:${C.cobaltX}`);
  return s;
}, (lt, s, t) => {
  s.grid.style.transform = `translate(${(-lt*10).toFixed(1)}px,${(-lt*16).toFixed(1)}px)`;
  const size = pick(150, 170), gap = size*.3, ww = s.lock.word.el.offsetWidth;
  const mp = seg(lt, .05, .6);
  setMarkDraw(s.lock.mark, seg(lt, .1, 1.0));
  let mx, my, wx, wy;
  if (!V){ const tot = size + gap + ww; mx = W/2 - tot/2 + size/2; my = H*.33; wx = mx + size/2 + gap + ww/2; wy = my + size*.02; }
  else { mx = W/2; my = H*.30; wx = W/2; wy = my + size*.95; }
  P(s.lock.mark, mx, my, { s: lerp(.4, 1, bo(mp)), o: clamp(mp*3) });
  reveal(s.lock.word, lt, .35, 0, .5);
  P(s.lock.word.el, wx, wy);
  if (V) fitW(s.tag.el, 960);
  reveal(s.tag, lt, .45, .08, .55);
  const ty = V ? H*.56 : H*.60;
  P(s.tag.el, W/2, ty, { s: 1 + lt*.004 });
  const tw = s.tag.el.offsetWidth * 1.02;
  s.tape.style.width = tw + 'px';
  P(s.tape, W/2 - tw/2, ty + pick(70, 58), { ax: 0, sx: eo(seg(lt, 1.1, 1.35)), r: -.8, o: lt > 1.1 ? 1 : 0 });
  const sp = eo(seg(lt, 3.0, 3.5));
  P(s.sub, W/2, ty + pick(150, 140) + (1 - sp)*16, { o: sp });
  P(s.pub, W/2, H - pick(70, 120), { o: eo(seg(lt, 3.3, 3.9)) });
  s.fade.style.opacity = ci(seg(lt, 5.35, 6.0));
});

/* ───────────────────────── transitions (fx layer): packing-tape wipes, flashes ───────────────────────── */
const fx = document.getElementById('fx');
const TAPES = [b(24), b(56), b(100)];      // cut times covered by a tape wipe
let tapeEls = [];
function buildFx(){
  tapeEls = TAPES.map(() => {
    const e = mk('div', 'a', fx, `width:${W*1.5}px;height:${H*2.4}px;background:${C.yellow};
      background-image:repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 210px, rgba(31,75,216,.0) 210px 211px),
      linear-gradient(90deg, rgba(0,0,0,.12) 0 6px, transparent 6px calc(100% - 6px), rgba(0,0,0,.12) calc(100% - 6px));
      box-shadow:0 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:120px;overflow:hidden`);
    for (let i = 0; i < 9; i++){
      const row = mk('div', null, e, `display:flex;gap:90px;align-items:center;white-space:nowrap;transform:translateX(${(i % 2) * 120}px);opacity:.9`);
      for (let j = 0; j < 7; j++){ mk('div', null, row, 'width:58px;height:58px', markSvg(58, C.cobalt, '#fff'));
        mk('div', 'h', row, `font-size:56px;color:${C.cobalt};font-weight:900;font-stretch:118%`, 'Expedo'); }
    }
    return e;
  });
}
function fxRender(t){
  TAPES.forEach((tc, i) => {
    const p = seg(t, tc - .26, tc + .26);
    const e = tapeEls[i];
    const bw = W*1.5, travel = W + bw + H*.5;
    const x = W/2 + lerp(-travel/2 - bw*.1, travel/2 + bw*.1, sio(p));
    P(e, x, H/2, { r: -14, o: p > 0 && p < 1 ? 1 : 0 });
  });
}

/* ───────────────────────── setup / render ───────────────────────── */
const stage = document.getElementById('stage'), scenesEl = document.getElementById('scenes');
function setup(){
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  SCENES.forEach(sc => {
    sc.root = mk('div', 'root', scenesEl, `width:${W}px;height:${H}px`);
    sc.st = sc.build(sc.root);
    if (sc.opts.fit) sc.opts.fit(sc.st);
    sc.root.querySelectorAll('[data-maxw]').forEach(e => fitW(e, +e.dataset.maxw));
    sc.root.style.display = 'none';
  });
  buildFx();
}
window.render = function(t){
  t = clamp(t, 0, T_END - 1e-4);
  for (const sc of SCENES){
    const on = t >= sc.a && t < sc.b;
    sc.root.style.display = on ? '' : 'none';
    if (!on) continue;
    const lt = t - sc.a;
    const punch = 1 + .03*(1 - eo(seg(lt, 0, .4)));        // a small punch on every cut
    sc.root.style.transform = `scale(${punch.toFixed(4)})`;
    sc.upd(lt, sc.st, t);
  }
  fxRender(t);
  return true;
};
window.T_END = T_END; window.BEAT = BEAT; window.LAYOUT = { W, H, LANG };

window.READY = false;
(async () => {
  await Promise.all([document.fonts.load("800 80px Archivo"), document.fonts.load("900 80px Archivo"), document.fonts.load("700 30px Archivo"),
    document.fonts.load("600 20px Inter"), document.fonts.load("700 20px Inter"), document.fonts.load("400 14px Inter"), document.fonts.load("500 16px 'JetBrains Mono'")]);
  await document.fonts.ready;
  setup();
  const srcs = new Set();
  document.querySelectorAll('img').forEach(i => srcs.add(i.src));
  document.querySelectorAll('div').forEach(d => { const m = /url\("?([^")]+)"?\)/.exec(d.style.backgroundImage || ''); if (m) srcs.add(m[1]); });
  await Promise.all([...srcs].map(s => { const im = new Image(); im.src = s; return im.decode().catch(() => new Promise(r => { im.onload = im.onerror = r; if (im.complete) r(); })); }));
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  render(0);
  window.READY = true;
  if (Q.get('play')){ const t0 = performance.now(); const loop = () => { render(((performance.now() - t0)/1000) % T_END); requestAnimationFrame(loop); }; loop(); }
  else if (Q.get('t')) render(parseFloat(Q.get('t')));
})();
</script>
