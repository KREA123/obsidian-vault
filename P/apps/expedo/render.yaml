# Render blueprint, free plan: no persistent disk, so the SQLite database is snapshotted to a free
# Key Value instance (BACKUP_REDIS_URL) and restored on boot; KEEP_AWAKE stops the 15-minute spin-down.
# With a paid plan: plan: starter, add the disk below, DB_FILE=/var/data/expedo.db, drop the Key Value.
services:
  - type: keyvalue
    name: expedo-store
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
  - type: web
    name: expedo
    runtime: node
    plan: free
    # EU region: the privacy policy and the data processing addendum say the data is stored in Frankfurt.
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    rootDir: P/apps/expedo
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: data/expedo.db
      - key: BACKUP_REDIS_URL
        fromService:
          type: keyvalue
          name: expedo-store
          property: connectionString
      - key: KEEP_AWAKE
        value: "1"
      - key: APP_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_PARTNER_ORG_ID
        sync: false
      - key: SHOPIFY_PARTNER_API_TOKEN
        sync: false
      - key: SHOPIFY_APP_GID
        sync: false
